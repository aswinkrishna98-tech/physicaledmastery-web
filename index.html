{id:"TME-001",exam:["UGC NET","KVS PGT"],subject:"Test, Measurement & Evaluation",topic:"Fitness Testing",difficulty:"Easy",type:"MCQ",year:2023,
question:"The Cooper 12-Minute Run Test is primarily used to estimate:",
options:["Muscular Strength","Flexibility","Cardiorespiratory Endurance (VO2 Max)","Agility"],correctIndex:2,
explanation:"The Cooper 12-Minute Run Test measures the maximum distance covered in 12 minutes and uses a formula to estimate VO2 Max, serving as a field-based cardiorespiratory endurance test.",
concept:{title:"Cooper 12-Minute Run Test",definition:"A widely used field test developed by Dr. Kenneth Cooper in 1968.",points:["Formula: VO2 Max = (Distance in meters − 504.9) / 44.73","Requires only a track/measured distance and a stopwatch","Widely used in military, police, and school fitness assessments"],memoryTrick:"'Cooper = Cardio' — always about aerobic capacity.",sportsRelevance:"Commonly used as a low-cost fitness screening tool for team selection and training benchmarking."},
relatedIds:["PHY-002","FML-001"],source:"Measurement & Evaluation in PE - Barrow & McGee",tags:["fitness-testing"]},

{id:"TME-002",exam:["UGC NET","SET"],subject:"Test, Measurement & Evaluation",topic:"Test Criteria",difficulty:"Hard",type:"MCQ",year:2024,
question:"A test that consistently produces the same results under similar conditions is said to have high:",
options:["Validity","Reliability","Objectivity","Norm-referencing"],correctIndex:1,
explanation:"Reliability refers to the consistency or repeatability of a test's results. A test can be reliable without being valid, but a valid test must also be reliable.",
concept:{title:"Criteria of a Good Test",definition:"Four key criteria determine whether a fitness/skill test is well-constructed.",points:["Validity: does the test measure what it claims to measure?","Reliability: consistency of results on repeated testing","Objectivity: consistency of scoring across different testers","Norms/Standards: comparison reference points for interpreting scores"],memoryTrick:"'Reliable = Repeatable'.",sportsRelevance:"Coaches must trust the reliability of a test before using it to track athlete progress over a season."},
relatedIds:["TME-003"],source:"Measurement & Evaluation in PE - Barrow & McGee",tags:["test-criteria"]},

{id:"TME-003",exam:["UGC NET"],subject:"Test, Measurement & Evaluation",topic:"Test Criteria",difficulty:"Hard",type:"MCQ",year:2022,
question:"When a test measures exactly what it is intended to measure, it is said to possess:",
options:["Reliability","Objectivity","Validity","Practicability"],correctIndex:2,
explanation:"Validity is the degree to which a test measures what it is designed/claims to measure. It is considered the single most important criterion of a good test.",
concept:{title:"Validity",definition:"The most critical test criterion — a test can be reliable yet invalid, but not valid without also being reliable.",points:["Content Validity: covers the full content domain","Criterion Validity: correlates with an established gold-standard measure","Construct Validity: measures the underlying theoretical trait"],memoryTrick:"'Valid = measures what it's SUPPOSED to'.",sportsRelevance:"A vertical jump test is valid for leg power but not for measuring aerobic endurance."},

/* ------------------------------ Persistence ------------------------------ */
function safeGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function safeSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}
function usePersistentState(key, initial){
  const [state, setState] = useState(()=>safeGet(key, initial));
  useEffect(()=>{ safeSet(key, state); },[key, state]);
  return [state, setState];
}

/* --------------------------------- Utils --------------------------------- */
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const pad = n=>String(n).padStart(2,"0");
  return h>0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function todayStr(d=new Date()){ return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(arr,n){ return shuffle(arr).slice(0,n); }
function byId(arr){ const m={}; arr.forEach(x=>m[x.id]=x); return m; }
const QUESTIONS_BY_ID = byId(QUESTION_BANK);
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function letters(i){ return ["A","B","C","D","E","F"][i]; }

  let id = safeGet("pep_user_id", null);

    safeSet("pep_user_id", id);
  }
  return id;
}

function loadRazorpayScript(){
  return new Promise((resolve, reject)=>{
    if(window.Razorpay){ resolve(); return; }
    const existing = document.querySelector('script[data-razorpay-checkout]');
    if(existing){
      existing.addEventListener("load", ()=>resolve());
      existing.addEventListener("error", ()=>reject(new Error("script-blocked")));
      return;
    }
    const script = document.createElement("script");
    script.src = RAZORPAY_CHECKOUT_SRC;
    script.setAttribute("data-razorpay-checkout","1");
    script.onload = ()=>resolve();
    script.onerror = ()=>reject(new Error("script-blocked"));
    document.head.appendChild(script);
    // Belt-and-suspenders timeout in case onerror never fires (e.g. a CSP
    // that silently drops the request rather than erroring it).
    setTimeout(()=>{ if(!window.Razorpay) reject(new Error("script-timeout")); }, 6000);
  });
}

  },[setProfile,notify]);

      const orderRes = await fetch(`${PAYMENTS.backendUrl}/api/create-order`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({userId, plan}),
      });
      if(!orderRes.ok){
        const err = await orderRes.json().catch(()=>({}));

                userId, plan,
                razorpay_order_id: response.razorpay_order_id,
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_signature: response.razorpay_signature,
              }),
            });
            if(!verifyRes.ok) throw new Error("Payment could not be verified");
            const result = await verifyRes.json();
            setProfile(p=>({...p, plan: result.plan}));
            notify((PLAN_LABELS[plan]||plan)+" unlocked — payment verified.", 3600);
          }catch(e){
            notify("Payment succeeded but verification failed — please contact support before retrying.", 5000);
          }finally{
            setCheckoutBusy(false);
          }
        },
        modal: { ondismiss: ()=>setCheckoutBusy(false) },
      });
      rzp.on("payment.failed", ()=>{
        notify("Payment failed or was cancelled — your plan hasn't changed.", 4000);
        setCheckoutBusy(false);
      });
      rzp.open();
    }catch(e){
      setCheckoutBusy(false);
      if(e.message === "script-blocked" || e.message === "script-timeout"){
        notify("Real checkout can't open in this hosting environment (Razorpay's script is blocked here). Deploy the app with server/ per its README to enable real payments.", 6000);
      } else {
        notify(e.message || "Couldn't start checkout — please try again.", 4000);
      }
    }
  },[setProfile,notify,profile.name]);

  const upgradePlan = paymentsLive ? upgradePlanReal : upgradePlanDemo;

  // derived accuracy across attempts
  const accuracy = useMemo(()=>{
    const list = Object.values(attempts);
    if(list.length===0) return 78; // demo baseline before any activity
    const correct = list.filter(a=>a.correct).length;
    return Math.round((correct/list.length)*100);
  },[attempts]);

  // derived weak/strong subjects from real attempts, seeded with demo baseline if empty
  const subjectStats = useMemo(()=>{
    const stats = {};
    Object.values(attempts).forEach(a=>{
      if(!a.subject) return;
      stats[a.subject] = stats[a.subject] || {correct:0,total:0};
      stats[a.subject].total++;
      if(a.correct) stats[a.subject].correct++;
    });
    let rows = Object.entries(stats).map(([subject,s])=>({subject, accuracy: Math.round((s.correct/s.total)*100), total:s.total}));
    if(rows.length < 3){
      const demo = [
        {subject:"Anatomy",accuracy:82,total:40},{subject:"Physiology",accuracy:76,total:35},
        {subject:"Biomechanics",accuracy:52,total:18},{subject:"Test, Measurement & Evaluation",accuracy:58,total:22},
        {subject:"Sports Psychology",accuracy:61,total:26},{subject:"Sports Training",accuracy:71,total:30},
      ];
      const have = new Set(rows.map(r=>r.subject));
      demo.forEach(d=>{ if(!have.has(d.subject)) rows.push(d); });
    }
    return rows.sort((a,b)=>a.accuracy-b.accuracy);
  },[attempts]);

  const value = {
    route, routeParams, goto,
    theme, setTheme,
    profile, setProfile, addXp, touchStreak,
    attempts, recordAttempt, accuracy, subjectStats,
    bookmarks, toggleBookmark,
    wrongLog, setWrongLog,
    mockHistory, saveMockResult,
    toast, notify,
    dailyState, setDailyState,
    studyPlan, setStudyPlan,
    isPro, freeMocksUsed, mockLocked, upgradePlan, paymentsLive, checkoutBusy,
  };
  return React.createElement(AppCtx.Provider,{value}, children);
}

</script>

function BarChart({data, height=220, valueSuffix="%", colorFn}){
  // data: [{label, value}]
  const max = Math.max(100, ...data.map(d=>d.value));
  const padL = 34, padB = 34, padT = 26, padR = 10;
  const w = Math.max(360, data.length*70);
  const plotH = height - padT - padB;
  const plotW = w - padL - padR;
  const barW = Math.min(46, plotW/data.length - 16);
  const ticks = [0,25,50,75,100];
  return React.createElement("div",{className:"overflow-x"},
    React.createElement("svg",{viewBox:`0 0 ${w} ${height}`, width:"100%", style:{minWidth:w, height}},
      ticks.map(t=>{
        const y = padT + plotH - (t/max>1?1:t/max)*plotH;
        return React.createElement("g",{key:t},
          React.createElement("line",{x1:padL, x2:w-padR, y1:y, y2:y, className:"chart-grid"}),
          React.createElement("text",{x:padL-8, y:y+4, textAnchor:"end", className:"chart-label"}, t)
        );
      }),
      data.map((d,i)=>{
        const x = padL + i*(plotW/data.length) + (plotW/data.length - barW)/2;
        const barH = (Math.min(d.value,max)/max)*plotH;
        const y = padT + plotH - barH;
        const color = colorFn ? colorFn(d) : (d.value>=75?"var(--success)":d.value>=55?"var(--warning)":"var(--danger)");
        return React.createElement("g",{key:i},

}

function LineChart({points, height=180, color="var(--info)", valueSuffix=""}){
  // points: [{label,value}]

  const padL=30,padR=14,padT=16,padB=28;

  const xy = points.map((p,i)=>({
    x: padL + (points.length===1?0:i*(plotW/(points.length-1))),
    y: padT + plotH - ((p.value-min)/(max-min||1))*plotH,
    ...p
  }));
  const path = xy.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
  const area = path + ` L${xy[xy.length-1].x},${padT+plotH} L${xy[0].x},${padT+plotH} Z`;
  return React.createElement("div",{className:"overflow-x"},
    React.createElement("svg",{viewBox:`0 0 ${w} ${height}`, width:"100%", style:{minWidth:w, height}},
      React.createElement("defs",null,
        React.createElement("linearGradient",{id:"lcGrad", x1:"0",y1:"0",x2:"0",y2:"1"},
          React.createElement("stop",{offset:"0%", style:{stopColor:color, stopOpacity:.28}}),
          React.createElement("stop",{offset:"100%", style:{stopColor:color, stopOpacity:0}})
        )

      React.createElement("path",{d:area, style:{fill:"url(#lcGrad)"}}),
      React.createElement("path",{d:path, style:{fill:"none",stroke:color,strokeWidth:2.5,strokeLinejoin:"round",strokeLinecap:"round"}}),
      xy.map((p,i)=>React.createElement("g",{key:i},
        React.createElement("circle",{cx:p.x, cy:p.y, r:i===xy.length-1?4.5:3, style:{fill:color}}),
        React.createElement("text",{x:p.x, y:height-8, textAnchor:"middle", className:"chart-label"}, p.label)
      ))
    )
  );
}

function DonutChart({value, size=140, color="var(--accent)", label, sub}){
  const r = size/2-14, c = 2*Math.PI*r, off = c*(1-value/100);
  return React.createElement("div",{style:{position:"relative", width:size, height:size}},

function QuestionPalette({questions, responses, idx, onJump, groupBySubject}){
  const groups = useMemo(()=>{
    if(!groupBySubject) return [{label:null, items: questions.map((q,i)=>i)}];
    const map = {};
    questions.forEach((q,i)=>{ map[q.subject] = map[q.subject]||[]; map[q.subject].push(i); });
    return Object.entries(map).map(([label,items])=>({label,items}));
  },[questions,groupBySubject]);

  function statusOf(i){
    const r = responses[questions[i].id] || {};
    if(r.marked && r.selected!=null) return "review answered";
    if(r.marked) return "review";
    if(r.selected!=null) return "answered";
    if(r.visited) return "visited notvisited";
    return "notvisited";
  }
  return React.createElement("div",{className:"card card-pad", style:{position:"sticky", top:88}},
    React.createElement("h3",{className:"h3", style:{marginBottom:4}}, "Question Palette"),
    React.createElement("p",{className:"tiny muted", style:{marginBottom:14}}, questions.length+" questions total"),

      React.createElement("div",{className:"palette-grid"},
        g.items.map(i=>{
          const st = statusOf(i);
          const cls = "pnode "+(st.includes("review")?"review":st.includes("answered")?"answered":st.includes("notvisited")&&!st.includes("visited ")?"notvisited":"")+(i===idx?" current":"");
          return React.createElement("button",{key:i, className:cls, onClick:()=>onJump(i)}, i+1);
        })

function TestEngine({mode, questions:initialQuestions, title, examMeta, onExit, onFinish}){
  const {recordAttempt, notify, toggleBookmark, bookmarks, goto} = useApp();
  const [questions,setQuestions] = useState(initialQuestions);

  const [secondsElapsed,setSecondsElapsed] = useState(0);
  const startRef = useRef(Date.now());
  const submittedRef = useRef(false);

  const q = questions[idx];
  const resp = responses[q.id] || {selected:null, checked:false, marked:false, visited:false, timeSpent:0};

  useEffect(()=>{
    setResponses(prev=>prev[q.id] ? (prev[q.id].visited? prev : {...prev, [q.id]:{...prev[q.id], visited:true}}) : {...prev, [q.id]:{selected:null,checked:false,marked:false,visited:true,timeSpent:0}});
    startRef.current = Date.now();
    // eslint-disable-next-line
  },[idx, q.id]);

  useEffect(()=>{
    const t = setInterval(()=>{
      if(isMock){
        setSecondsLeft(s=>{
          if(s<=1){ clearInterval(t); if(!submittedRef.current){ submittedRef.current=true; setTimeout(()=>handleSubmit(true),0); } return 0; }
          return s-1;
        });
      } else {
        setSecondsElapsed(s=>s+1);
      }
    },1000);
    return ()=>clearInterval(t);
    // eslint-disable-next-line
  },[]);

  function touchTime(qid){
    const spent = (Date.now()-startRef.current)/1000;
    setResponses(prev=>({...prev, [qid]:{...prev[qid], timeSpent:(prev[qid]?.timeSpent||0)+spent}}));
    startRef.current = Date.now();
  }

  function selectOption(i){
    if(!isMock && resp.checked) return;
    setResponses(prev=>({...prev, [q.id]:{...prev[q.id], selected:i}}));
  }
  function toggleMark(){
    setResponses(prev=>({...prev, [q.id]:{...prev[q.id], marked: !prev[q.id].marked}}));
  }
  function clearResponse(){
    setResponses(prev=>({...prev, [q.id]:{...prev[q.id], selected:null, checked:false}}));
  }
  function checkAnswer(){
    if(resp.selected==null) { notify("Select an option first"); return; }
    touchTime(q.id);
    recordAttempt(q, resp.selected, resp.timeSpent);
    setResponses(prev=>({...prev, [q.id]:{...prev[q.id], checked:true}}));
  }
  function goNext(){ touchTime(q.id); setIdx(i=>Math.min(questions.length-1, i+1)); }
  function goPrev(){ touchTime(q.id); setIdx(i=>Math.max(0, i-1)); }
  function jump(i){ touchTime(q.id); setIdx(i); }
  function addRelated(rid){
    const rq = QUESTIONS_BY_ID[rid];
    if(!rq) return;
    let targetIdx = questions.findIndex(x=>x.id===rid);
    if(targetIdx===-1){
      setQuestions(prev=>[...prev, rq]);
      setResponses(prev=>({...prev, [rq.id]: prev[rq.id]||{selected:null,checked:false,marked:false,visited:false,timeSpent:0}}));
      targetIdx = questions.length;
      notify("Added related question to this set");
    }
    touchTime(q.id);
    setIdx(targetIdx);
  }

  function handleSubmit(auto){
    if(mode==="practice"){
      setShowSummary(true);
      return;
    }
    // Mock scoring
    touchTime(q.id);
    const neg = examMeta?.negativeMarking ?? 0.25;
    let correct=0, incorrect=0, unattempted=0;
    const subjectMap = {};
    const diffMap = {};
    let totalTime = 0;
    questions.forEach(qq=>{
      const r = responses[qq.id] || {};
      totalTime += r.timeSpent||0;
      subjectMap[qq.subject] = subjectMap[qq.subject] || {correct:0,total:0};
      subjectMap[qq.subject].total++;
      diffMap[qq.difficulty] = diffMap[qq.difficulty] || {correct:0,total:0};
      diffMap[qq.difficulty].total++;
      if(r.selected==null){ unattempted++; }
      else if(r.selected===qq.correctIndex){ correct++; subjectMap[qq.subject].correct++; diffMap[qq.difficulty].correct++; recordAttempt(qq, r.selected, r.timeSpent); }
      else { incorrect++; recordAttempt(qq, r.selected, r.timeSpent); }
    });
    const score = Math.max(0, correct*1 - incorrect*neg);
    const attempted = correct+incorrect;
    const accuracy = attempted>0 ? Math.round((correct/attempted)*100) : 0;
    const subjectPerf = Object.entries(subjectMap).map(([subject,s])=>({subject, accuracy: s.total? Math.round((s.correct/s.total)*100):0, total:s.total}));
    const diffPerf = Object.entries(diffMap).map(([difficulty,s])=>({difficulty, accuracy: s.total? Math.round((s.correct/s.total)*100):0, total:s.total}));
    const result = {
      id:"mock-"+Date.now(), title: title||"Mock Test", date: new Date().toISOString(),
      totalQuestions: questions.length, correct, incorrect, unattempted, attempted, score: Math.round(score*100)/100,
      maxScore: questions.length, accuracy, totalTime: Math.round(totalTime), avgTimePerQ: attempted? Math.round(totalTime/attempted):0,
      subjectPerf, diffPerf, negativeMarking:neg, auto: !!auto,
    };
    onFinish(result);
  }

  if(showSummary && mode==="practice"){
    const answered = Object.values(responses).filter(r=>r.selected!=null);
    const correct = questions.filter(qq=>responses[qq.id]?.selected===qq.correctIndex).length;
    const wrong = questions.filter(qq=>responses[qq.id]?.checked && responses[qq.id]?.selected!==qq.correctIndex);
    return React.createElement("div",{className:"container", style:{padding:"40px 24px 64px", maxWidth:820}},
      React.createElement("div",{className:"card card-pad", style:{textAlign:"center"}},
        React.createElement(DonutChart,{value: answered.length? Math.round((correct/answered.length)*100):0, size:150, color:"var(--success)"}),
        React.createElement("h2",{className:"h1", style:{marginTop:16}}, "Practice Session Complete"),
        React.createElement("p",{className:"muted small", style:{marginTop:6}}, correct+" correct out of "+answered.length+" attempted ("+questions.length+" total)")
      ),
      React.createElement("div",{className:"grid grid-4", style:{margin:"24px 0"}},
        React.createElement(StatTile,{label:"Attempted", value:answered.length}),
        React.createElement(StatTile,{label:"Correct", value:correct, subClass:"pill-success"}),
        React.createElement(StatTile,{label:"Incorrect", value:answered.length-correct, subClass:"pill-danger"}),
        React.createElement(StatTile,{label:"Time Spent", value:fmtTime(secondsElapsed)})
      ),
      wrong.length>0 && React.createElement("div",{className:"card card-pad", style:{marginBottom:20}},
        React.createElement("h3",{className:"h3", style:{marginBottom:12}}, "Review Your Mistakes"),
        React.createElement("div",{className:"flex-col gap-10"},
          wrong.map(wq=>React.createElement("div",{key:wq.id, className:"small", style:{padding:"10px 0", borderBottom:"1px solid var(--border)"}},
            React.createElement("div",{style:{fontWeight:600, marginBottom:4}}, wq.question.split("\n")[0]),
            React.createElement("div",{className:"muted tiny"}, "Correct answer: "+wq.options[wq.correctIndex])
          ))
        )
      ),
      React.createElement("div",{className:"flex gap-12 wrap"},
        React.createElement("button",{className:"btn btn-primary", onClick:onExit}, "Back to Question Bank"),
        React.createElement("button",{className:"btn btn-outline", onClick:()=>goto("/my-mistakes")}, "Go to My Mistakes"),
        React.createElement("button",{className:"btn btn-outline", onClick:()=>goto("/dashboard")}, "View Dashboard")
      )
    );
  }

  const timeDisplay = isMock ? fmtTime(secondsLeft) : fmtTime(secondsElapsed);
  const low = isMock && secondsLeft < 120;
  const isBookmarked = (bookmarks.questions||[]).includes(q.id);

  return React.createElement("div",{className:"container", style:{padding:"24px 24px 64px"}},
    React.createElement("div",{className:"flex justify-between items-center wrap gap-12", style:{marginBottom:18}},
      React.createElement("div",null,
        React.createElement("h2",{className:"h2"}, title || (isMock ? "Mock Test" : "Practice Session")),
        React.createElement("p",{className:"tiny muted"}, isMock ? "Full-screen exam mode · Negative marking: -"+(examMeta?.negativeMarking??0.25) : "Practice mode · instant explanations")
      ),
      React.createElement("div",{className:"flex items-center gap-10"},
        React.createElement("span",{className:"timer-badge"+(low?" low":"")}, React.createElement(Icon,{name:"clock",size:14}), timeDisplay),
        React.createElement("button",{className:"btn btn-outline btn-sm", onClick:()=>{ if(confirm(isMock?"Submit the test now?":"End this practice session?")) handleSubmit(false); }}, isMock?"Submit Test":"End Practice")
      )
    ),
    React.createElement("div",{className:"practice-shell"},
      React.createElement("div",{className:"card qcard"},
        React.createElement("div",{className:"qmeta"},
          React.createElement("span",{className:"pill pill-info"}, "Question "+(idx+1)+"/"+questions.length),
          React.createElement("span",{className:"pill"}, q.subject),
          React.createElement(DifficultyPill,{level:q.difficulty}),
          React.createElement("span",{className:"pill"}, q.type),
          !isMock && React.createElement("span",{style:{marginLeft:"auto"}}, React.createElement(BookmarkButton,{type:"questions",id:q.id}))
        ),
        React.createElement("p",{className:"qtext"}, q.question),
        React.createElement("div",{className:"options"},
          q.options.map((opt,i)=>{
            let cls="option";
            if(!isMock && resp.checked){
              if(i===q.correctIndex) cls+=" correct";
              else if(i===resp.selected) cls+=" incorrect";
            } else if(resp.selected===i) cls+=" selected";
            return React.createElement("div",{key:i, className:cls, onClick:()=>selectOption(i)},
              React.createElement("span",{className:"option-letter"}, letters(i)),
              React.createElement("span",null, opt)
            );
          })
        ),
        React.createElement("div",{className:"qactions"},
          React.createElement("div",{className:"flex gap-8 wrap"},
            React.createElement("button",{className:"btn btn-outline btn-sm", onClick:goPrev, disabled:idx===0}, React.createElement(Icon,{name:"chevronLeft",size:14}),"Previous"),
            React.createElement("button",{className:"btn btn-outline btn-sm", onClick:toggleMark}, React.createElement(Icon,{name:"flag",size:14}), resp.marked?"Unmark":"Mark for Review"),
            React.createElement("button",{className:"btn btn-ghost btn-sm", onClick:clearResponse}, "Clear Response")
          ),
          React.createElement("div",{className:"flex gap-8 wrap"},
            !isMock && !resp.checked && React.createElement("button",{className:"btn btn-dark btn-sm", onClick:checkAnswer}, "Check Answer"),
            idx<questions.length-1 ?
              React.createElement("button",{className:"btn btn-primary btn-sm", onClick:goNext}, "Next", React.createElement(Icon,{name:"chevronRight",size:14})) :
              React.createElement("button",{className:"btn btn-primary btn-sm", onClick:()=>handleSubmit(false)}, isMock?"Submit Test":"Finish Practice")
          )
        ),
        (!isMock && resp.checked) && React.createElement(React.Fragment,null,
          React.createElement("div",{className:"explain-box"},
            React.createElement("h4",{className:"h3"}, resp.selected===q.correctIndex ? "✅ Correct!" : "❌ Not quite — here's why"),
            React.createElement("p",{className:"small", style:{marginTop:6}}, q.explanation),
            React.createElement("p",{className:"tiny muted", style:{marginTop:8}}, "Source: "+q.source)
          ),
          React.createElement(ConceptBox,{concept:q.concept}),
          q.relatedIds?.length>0 && React.createElement("div",{style:{marginTop:14}},
            React.createElement("span",{className:"label"}, "Related Questions"),
            React.createElement("div",{className:"flex gap-8 wrap", style:{marginTop:8}},
              q.relatedIds.map(rid=>{
                const rq = QUESTIONS_BY_ID[rid];
                if(!rq) return null;
                return React.createElement("button",{key:rid, className:"chip", onClick:()=>addRelated(rid)}, rq.topic);
              })
            )
          )
        )
      ),
      React.createElement(QuestionPalette,{questions, responses, idx, onJump:jump, groupBySubject:isMock})
    )
  );
}

</script>

/* --------------------------- Question of the Day --------------------------- */
function seedIndexForDate(len){ const d=todayStr(); let h=0; for(const c of d) h=(h*31+c.charCodeAt(0))>>>0; return h%len; }
function QuestionOfTheDayPage(){
  const {dailyState, setDailyState, recordAttempt} = useApp();
  const qotd = QUESTION_BANK[seedIndexForDate(QUESTION_BANK.length)];
  const answered = dailyState.lastQOTD===todayStr();
  const [selected,setSelected] = useState(answered ? dailyState.qotdAnswer : null);
  const distribution = useMemo(()=>{
    // deterministic demo distribution of what % chose each option
    let seed = seedIndexForDate(97);
    return qotd.options.map((_,i)=>{
      seed = (seed*9301+49297)%233280;
      return i===qotd.correctIndex ? 45+Math.floor((seed%20)) : Math.floor((seed%20));
    });
  },[qotd]);
  const total = distribution.reduce((a,b)=>a+b,0)||1;

  function submit(i){
    setSelected(i);
    recordAttempt(qotd, i, 0);
    setDailyState(s=>({...s, lastQOTD:todayStr(), qotdAnswer:i}));
  }

  return React.createElement("div",{className:"container", style:{padding:"36px 24px 72px", maxWidth:680}},
    React.createElement(SectionHeading,{eyebrow:"Question of the Day", title:new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}),
    React.createElement("div",{className:"card card-pad"},

      React.createElement("p",{className:"qtext"}, qotd.question),
      React.createElement("div",{className:"options"},
        qotd.options.map((opt,i)=>{
          const pct = Math.round((distribution[i]/total)*100);
          let cls="option";
          if(selected!=null){ if(i===qotd.correctIndex) cls+=" correct"; else if(i===selected) cls+=" incorrect"; }
          return React.createElement("div",{key:i, className:cls, style:{position:"relative",overflow:"hidden"}, onClick:()=>selected==null && submit(i)},
            selected!=null && React.createElement("div",{style:{position:"absolute",inset:0,background:"var(--surface-3)",width:pct+"%",zIndex:0,opacity:.5}}),
            React.createElement("span",{className:"option-letter",style:{position:"relative"}}, letters(i)),
            React.createElement("span",{style:{position:"relative",flex:1}}, opt),
            selected!=null && React.createElement("span",{className:"num small",style:{position:"relative",fontWeight:700}}, pct+"%")
          );
        })
      ),
      selected!=null && React.createElement("div",{className:"explain-box"}, React.createElement("p",{className:"small"}, qotd.explanation)),
      React.createElement("div",{className:"flex gap-10 wrap", style:{marginTop:16}},
        React.createElement("button",{className:"btn btn-outline btn-sm"}, "Share Question"),
        React.createElement("button",{className:"btn btn-outline btn-sm"}, "Challenge a Friend")
      )
    )
  );

const STUDY_PLAN_TASKS = ["Concept Study","Topic-wise MCQs","Quick Revision"];
function generateStudyPlan(examName, days, hoursPerDay){
  const subjectCycle = SUBJECTS.filter(s=>["Sports Science","Coaching","Behavioural Science","Research","Indian Traditions","Sports Events","Sports Rules"].includes(s.group));
  const plan = [];
  for(let d=1; d<=days; d++){
    const subj = subjectCycle[(d-1)%subjectCycle.length];
    const totalMin = Math.round(hoursPerDay*60);
    plan.push({
      day:d, subject:subj.name,
      blocks:[
        {task:"Concept Study — "+subj.name, minutes:Math.round(totalMin*0.45)},
        {task:"Topic-wise MCQs", minutes:Math.round(totalMin*0.35)},
        {task:"Quick Revision", minutes:Math.round(totalMin*0.2)},
      ]
    });
  }
  return {examName, days, hoursPerDay, createdAt:Date.now(), plan};
}
