<title>PE Prep</title>
<meta name="description" content="India's dedicated preparation platform for Physical Education examinations.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@400;500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================================
   PE PREP — DESIGN SYSTEM
   Display: Big Shoulders (condensed, stadium-signage energy)
   Body:    IBM Plex Sans
   Data:    IBM Plex Mono (timers, scores, tabular stats)
   ========================================================================== */

:root{
  /* ---- Light theme (default) ---- */
  --ink:#0F2547;            /* primary text / brand navy */
  --ink-soft:#28405F;
  --paper:#F5F7FB;          /* app background, cool undertone (not warm cream) */
  --surface:#FFFFFF;
  --surface-2:#EDF1F8;
  --surface-3:#E3E9F3;
  --border:#DCE3EE;
  --border-strong:#C4D0E3;
  --muted:#5B6B85;
  --muted-2:#8695AC;

  --accent:#FF5A36;         /* cinder-track orange — CTAs */
  --accent-ink:#7A2410;
  --accent-100:#FFE7DF;
  --accent-hover:#E64821;

  --gold:#C7861A;           /* medal gold — XP / achievement (darkened for AA on white) */
  --gold-100:#FBEDCD;

  --success:#128A57;
  --success-100:#DEF5EA;
  --danger:#D8362A;
  --danger-100:#FBE3E1;
  --warning:#B4740A;
  --warning-100:#FBEDD3;
  --info:#4A4FDB;
  --info-100:#E7E7FC;

  --track-line:#D7E0EE;     /* lane-line divider motif */

  --shadow-sm: 0 1px 2px rgba(15,37,71,.06);
  --shadow-md: 0 4px 16px rgba(15,37,71,.09);
  --shadow-lg: 0 12px 32px rgba(15,37,71,.14);

  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --radius-pill:999px;

  --font-display:'Big Shoulders','Arial Narrow',sans-serif;
  --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E9EFFB;
    --ink-soft:#C3D0E6;
    --paper:#0A1220;
    --surface:#111B2E;
    --surface-2:#172239;
    --surface-3:#1E2B44;
    --border:#26344E;
    --border-strong:#344465;
    --muted:#93A4C2;
    --muted-2:#6B7D9C;

    --accent:#FF7A54;
    --accent-ink:#FFE0D4;
    --accent-100:#3A2118;
    --accent-hover:#FF6438;

    --gold:#F0C065;
    --gold-100:#3A2E10;

    --success:#3FCC93;
    --success-100:#0E2F22;
    --danger:#FF6B60;
    --danger-100:#3A1613;
    --warning:#F0B94D;
    --warning-100:#3A2A0C;
    --info:#8B8FFF;
    --info-100:#221F4A;

    --track-line:#243154;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
    --shadow-md: 0 4px 20px rgba(0,0,0,.45);
    --shadow-lg: 0 16px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ink:#E9EFFB; --ink-soft:#C3D0E6; --paper:#0A1220; --surface:#111B2E; --surface-2:#172239; --surface-3:#1E2B44;
  --border:#26344E; --border-strong:#344465; --muted:#93A4C2; --muted-2:#6B7D9C;
  --accent:#FF7A54; --accent-ink:#FFE0D4; --accent-100:#3A2118; --accent-hover:#FF6438;
  --gold:#F0C065; --gold-100:#3A2E10; --success:#3FCC93; --success-100:#0E2F22;
  --danger:#FF6B60; --danger-100:#3A1613; --warning:#F0B94D; --warning-100:#3A2A0C;
  --info:#8B8FFF; --info-100:#221F4A; --track-line:#243154;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.35); --shadow-md: 0 4px 20px rgba(0,0,0,.45); --shadow-lg: 0 16px 40px rgba(0,0,0,.55);
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-body);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
#root{min-height:100%;}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; letter-spacing:.01em; text-wrap:balance; margin:0; color:var(--ink);}
p{margin:0;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font-body); cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
::selection{background:var(--accent-100); color:var(--accent-ink);}
.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.container{max-width:1180px; margin:0 auto; padding:0 24px;}
@media (max-width:720px){ .container{padding:0 16px;} }
.overflow-x{overflow-x:auto;}
:focus-visible{outline:2px solid var(--info); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

/* ---- Type scale ---- */
.display-1{font-size:clamp(34px,5.4vw,64px); line-height:1.02; font-weight:800;}
.display-2{font-size:clamp(26px,3.6vw,42px); line-height:1.06; font-weight:800;}
.h1{font-size:clamp(22px,2.6vw,30px); line-height:1.15;}
.h2{font-size:20px; line-height:1.2;}
.h3{font-size:16px; line-height:1.3;}
.eyebrow{font-family:var(--font-display); font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:12.5px; color:var(--accent);}
.lede{font-size:17px; color:var(--muted); max-width:56ch;}
.small{font-size:13px;}
.tiny{font-size:11.5px;}
.muted{color:var(--muted);}

/* ---- Buttons ---- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:var(--radius-pill);
  padding:12px 22px; font-weight:600; font-size:14.5px; border:1px solid transparent; transition:transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease; white-space:nowrap;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent); color:#fff; box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--accent-hover); box-shadow:var(--shadow-md);}
.btn-dark{background:var(--ink); color:var(--paper);}
.btn-dark:hover{opacity:.9;}
.btn-outline{background:transparent; border-color:var(--border-strong); color:var(--ink);}
.btn-outline:hover{background:var(--surface-2); border-color:var(--ink-soft);}
.btn-ghost{background:transparent; color:var(--ink); padding:10px 14px;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:8px 14px; font-size:13px;}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
.btn-block{width:100%;}
.btn-icon{padding:10px; border-radius:var(--radius-pill);}

/* ---- Surfaces ---- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);}
.card-pad{padding:22px;}
.card-hover{transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;}
.card-hover:hover{transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--border-strong);}
.surface-2{background:var(--surface-2);}
.lane-divider{height:1px; background:repeating-linear-gradient(90deg,var(--track-line) 0 18px, transparent 18px 26px);}
.pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:var(--radius-pill); font-size:12px; font-weight:600; border:1px solid var(--border);}
.pill-accent{background:var(--accent-100); color:var(--accent-ink); border-color:transparent;}
.pill-success{background:var(--success-100); color:var(--success); border-color:transparent;}
.pill-danger{background:var(--danger-100); color:var(--danger); border-color:transparent;}
.pill-warning{background:var(--warning-100); color:var(--warning); border-color:transparent;}
.pill-info{background:var(--info-100); color:var(--info); border-color:transparent;}
.pill-gold{background:var(--gold-100); color:var(--gold); border-color:transparent;}

/* ---- Grid helpers ---- */
.grid{display:grid; gap:18px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-auto{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
@media (max-width:960px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
@media (max-width:620px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} }
.flex{display:flex;}
.flex-col{display:flex; flex-direction:column;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-4{gap:4px;} .gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;} .gap-24{gap:24px;}
.wrap{flex-wrap:wrap;}

/* ---- App shell / nav ---- */
.app-shell{min-height:100vh; display:flex; flex-direction:column;}
.topnav{position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
.topnav-inner{max-width:1360px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:18px;}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:800; font-size:20px; letter-spacing:.01em; flex:none;}
.brand-mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(155deg,var(--ink) 0%, var(--info) 130%); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-weight:800; font-size:15px; flex:none;}
.navlinks{display:flex; align-items:center; gap:1px; flex:1; overflow-x:auto; min-width:0;}
.navlink{padding:8px 11px; border-radius:var(--radius-pill); font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap;}
.navlink:hover{color:var(--ink); background:var(--surface-2);}
.navlink.active{color:var(--ink); background:var(--surface-3);}
.navcta{display:flex; align-items:center; gap:6px; flex:none;}
@media (max-width:1080px){ .navlinks{display:none;} }

.mobilebar{position:fixed; bottom:0; left:0; right:0; z-index:50; background:var(--surface); border-top:1px solid var(--border); display:none;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
.mobilebar-inner{display:grid; grid-template-columns:repeat(5,1fr);}
.mobilebar a{display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; font-size:10.5px; font-weight:600; color:var(--muted-2); border-radius:10px;}
.mobilebar a.active{color:var(--accent);}
@media (max-width:980px){ .mobilebar{display:block;} .app-main{padding-bottom:74px;} }

.footer{border-top:1px solid var(--border); margin-top:64px; padding:40px 0; color:var(--muted);}

/* ---- Hero ---- */
.hero{position:relative; overflow:hidden; padding:56px 0 40px;}
.hero-track{position:absolute; inset:0; opacity:.5; pointer-events:none;}
.hero-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:center; position:relative;}
@media (max-width:940px){ .hero-grid{grid-template-columns:1fr;} }
.hero-stats{display:flex; gap:26px; margin-top:28px; flex-wrap:wrap;}
.hero-stat b{display:block; font-family:var(--font-display); font-size:26px; color:var(--ink);}

/* ---- Stat tile ---- */
.stat-tile{border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-md); padding:16px 18px;}
.stat-tile .stat-label{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em;}
.stat-tile .stat-value{font-family:var(--font-mono); font-size:26px; font-weight:600; margin-top:6px; color:var(--ink);}
.stat-tile .stat-sub{font-size:12px; margin-top:4px;}

/* ---- Progress ---- */
.progress-track{height:8px; border-radius:var(--radius-pill); background:var(--surface-3); overflow:hidden;}
.progress-fill{height:100%; border-radius:var(--radius-pill); background:var(--accent); transition:width .4s ease;}
.progress-fill.success{background:var(--success);}
.progress-fill.info{background:var(--info);}

/* ---- Tabs ---- */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); overflow-x:auto;}
.tab{padding:11px 16px; font-size:13.5px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; white-space:nowrap;}
.tab.active{color:var(--ink); border-color:var(--accent);}

/* ---- Forms ---- */
.field{display:flex; flex-direction:column; gap:6px;}
.label{font-size:12.5px; font-weight:600; color:var(--muted);}
.input,.select{padding:10px 13px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-size:14px;}
.input:focus,.select:focus{outline:2px solid var(--info); outline-offset:0; border-color:var(--info);}
.chip-select{display:flex; flex-wrap:wrap; gap:8px;}
.chip{padding:8px 14px; border-radius:var(--radius-pill); border:1px solid var(--border-strong); font-size:13px; font-weight:600; color:var(--muted); background:var(--surface);}
.chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

/* ---- Exam / Subject cards ---- */
.exam-card{padding:20px; display:flex; flex-direction:column; gap:12px;}
.exam-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.exam-swatch{width:44px; height:44px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; color:#fff; font-size:16px;}
.subject-card{padding:16px; display:flex; flex-direction:column; gap:8px; cursor:pointer;}
.subject-group-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted-2); font-weight:700; margin:22px 0 10px;}

/* ---- Question / Practice interface ---- */
.practice-shell{display:grid; grid-template-columns:1fr 280px; gap:20px; align-items:start;}
@media (max-width:900px){ .practice-shell{grid-template-columns:1fr;} }
.qcard{padding:26px;}
.qmeta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.qtext{font-size:17px; line-height:1.6; font-weight:500; white-space:pre-line;}
.options{display:flex; flex-direction:column; gap:10px; margin-top:20px;}
.option{display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border:1.5px solid var(--border); border-radius:var(--radius-md); font-size:14.5px; transition:border-color .12s, background .12s;}
.option:hover{border-color:var(--border-strong); background:var(--surface-2);}
.option.selected{border-color:var(--info); background:var(--info-100);}
.option.correct{border-color:var(--success); background:var(--success-100);}
.option.incorrect{border-color:var(--danger); background:var(--danger-100);}
.option-letter{width:26px; height:26px; border-radius:50%; border:1.5px solid var(--border-strong); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex:none; font-family:var(--font-mono);}
.option.selected .option-letter{border-color:var(--info); background:var(--info); color:#fff;}
.option.correct .option-letter{border-color:var(--success); background:var(--success); color:#fff;}
.option.incorrect .option-letter{border-color:var(--danger); background:var(--danger); color:#fff;}
.qactions{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; padding-top:18px; border-top:1px solid var(--border); justify-content:space-between;}
.timer-badge{font-family:var(--font-mono); font-weight:600; font-size:15px; background:var(--surface-2); padding:8px 14px; border-radius:var(--radius-pill); display:flex; align-items:center; gap:8px; border:1px solid var(--border);}
.timer-badge.low{color:var(--danger); border-color:var(--danger);}
.palette-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
.pnode{aspect-ratio:1; border-radius:8px; font-family:var(--font-mono); font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--border-strong); background:var(--surface); color:var(--muted);}
.pnode.answered{background:var(--success); border-color:var(--success); color:#fff;}
.pnode.review{background:var(--gold); border-color:var(--gold); color:#fff;}
.pnode.current{outline:2px solid var(--info); outline-offset:2px;}
.pnode.notvisited{background:var(--surface-2);}
.legend-item{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);}
.legend-dot{width:11px; height:11px; border-radius:3px; flex:none;}

/* ---- Explanation panel ---- */
.explain-box{border-radius:var(--radius-md); padding:18px 20px; margin-top:16px; border:1px solid var(--border); background:var(--surface-2);}
.explain-box h4{margin-bottom:8px;}
.concept-box{border-radius:var(--radius-md); padding:20px; border:1px dashed var(--info); background:var(--info-100); margin-top:14px;}
.concept-box ul{margin:10px 0 0 18px; padding:0;}
.concept-box li{margin-bottom:6px; font-size:13.5px;}

/* ---- Flashcard ---- */
.flip-card{perspective:1200px; height:200px;}
.flip-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-lg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; text-align:center; padding:22px; background:var(--surface); box-shadow:var(--shadow-sm);}
.flip-back{transform:rotateY(180deg); background:var(--ink); color:var(--paper); border-color:var(--ink);}

/* ---- Charts (inline SVG) ---- */
.chart-label{font-size:11px; fill:var(--muted); font-family:var(--font-body);}
.chart-value{font-family:var(--font-mono); font-size:11px; fill:var(--ink);}
.chart-grid{stroke:var(--border); stroke-width:1;}

/* ---- Leaderboard ---- */
.lb-row{display:grid; grid-template-columns:40px 1fr auto auto auto; gap:16px; align-items:center; padding:12px 10px; border-radius:10px;}
.lb-row.me{background:var(--accent-100);}
.lb-rank{font-family:var(--font-display); font-weight:800; font-size:18px; color:var(--muted);}

/* ---- Misc states ---- */
.empty-state{text-align:center; padding:56px 20px; color:var(--muted);}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:var(--radius-sm);}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
.badge-tile{text-align:center; padding:18px 10px; border-radius:var(--radius-md); border:1px solid var(--border);}
.badge-tile.locked{opacity:.4; filter:grayscale(1);}
.badge-icon{font-size:30px;}
.streak-flame{font-size:22px;}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:var(--radius-pill); box-shadow:var(--shadow-lg); font-size:13.5px; font-weight:600; z-index:100; display:flex; align-items:center; gap:10px;}
@media (max-width:980px){ .toast{bottom:88px;} }

table.datatable{width:100%; border-collapse:collapse; font-size:13.5px;}
table.datatable th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--border);}
table.datatable td{padding:12px; border-bottom:1px solid var(--border);}
table.datatable tr:hover td{background:var(--surface-2);}

.kbd{font-family:var(--font-mono); background:var(--surface-3); border-radius:5px; padding:1px 6px; font-size:11px;}

</style>

<div id="root"></div>

const QUESTION_BANK = [

options:["196","206","216","226"],correctIndex:1,
explanation:"An adult human skeleton has 206 bones. Infants are born with about 270-300 bones/cartilage pieces, many of which fuse together during growth.",
concept:{title:"Total Bone Count",definition:"206 bones split into axial skeleton (80 bones: skull, vertebral column, ribcage) and appendicular skeleton (126 bones: limbs, girdles).",points:["Axial skeleton — 80 bones","Appendicular skeleton — 126 bones","Smallest bone: Stapes (ear)","Largest bone: Femur"],memoryTrick:"80 + 126 = 206 — split the skeleton into 'trunk' (axial) and 'limbs' (appendicular).",sportsRelevance:"Understanding bone classification helps in identifying injury-prone joints in different sports."},
relatedIds:["ANA-001","ANA-003"],source:"Gray's Anatomy for Students",tags:["skeletal","bones"]},

{id:"ANA-003",exam:["KVS PGT","State PSC"],subject:"Anatomy",topic:"Joints",difficulty:"Moderate",type:"MCQ",year:2021,
question:"The shoulder joint is an example of which type of joint?",
options:["Hinge joint","Pivot joint","Ball and socket joint","Saddle joint"],correctIndex:2,
explanation:"The shoulder (glenohumeral) joint is a ball-and-socket joint, allowing movement in almost all planes — flexion, extension, abduction, adduction, and rotation.",
concept:{title:"Classification of Synovial Joints",definition:"Synovial joints are classified by shape and movement permitted.",points:["Ball & socket — shoulder, hip (multiaxial)","Hinge — elbow, knee (uniaxial)","Pivot — atlas-axis (rotation only)","Saddle — thumb carpometacarpal"],memoryTrick:"'Shoulder shrugs in every direction' — ball & socket = maximum freedom.",sportsRelevance:"The shoulder's mobility makes it prone to dislocation in contact and throwing sports."},
relatedIds:["ANA-004","BIO-005"],source:"Essentials of Anatomy & Physiology",tags:["joints"]},

{id:"ANA-004",exam:["UGC NET"],subject:"Anatomy",topic:"Joints",difficulty:"Hard",type:"Assertion & Reason",year:2024,
question:"Assertion (A): The knee joint is more stable than the shoulder joint.\nReason (R): The knee joint has strong ligamentous support and menisci, while the shoulder relies mainly on the rotator cuff muscles.",
options:["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, R is false","A is false, R is true"],correctIndex:0,
explanation:"The knee's stability comes from collateral/cruciate ligaments and menisci, whereas the shoulder trades stability for mobility, relying on soft-tissue (rotator cuff) support — making R a correct and direct explanation of A.",
concept:{title:"Stability vs Mobility Trade-off",definition:"Joints are built along a mobility-stability spectrum; the shoulder favours mobility, the knee/hip favour stability.",points:["Knee: ACL, PCL, MCL, LCL, menisci","Shoulder: rotator cuff (SITS muscles) as dynamic stabilizers","More mobile joints = higher dislocation risk"],memoryTrick:"'Stable at the base (hip/knee), mobile at the ends (shoulder/ankle)'.",sportsRelevance:"ACL injuries in football/basketball and rotator cuff injuries in swimming/throwing sports stem from this trade-off."},
relatedIds:["ANA-003","INJ-002"],source:"Kinesiology text",tags:["joints","injury"]},

{id:"ANA-005",exam:["DSSSB","KVS PGT"],subject:"Anatomy",topic:"Muscular System",difficulty:"Easy",type:"MCQ",year:2023,
question:"Which is the largest muscle in the human body?",
options:["Deltoid","Gluteus Maximus","Latissimus Dorsi","Trapezius"],correctIndex:1,
explanation:"The Gluteus Maximus is the largest and heaviest muscle in the human body. It is a primary hip extensor crucial for running, jumping and climbing stairs.",
concept:{title:"Largest & Smallest Muscles",definition:"Muscle size is generally measured by mass/cross-sectional area.",points:["Largest: Gluteus Maximus","Smallest: Stapedius (middle ear)","Longest: Sartorius (thigh)"],memoryTrick:"'Glutes get you going' — biggest muscle, biggest propulsion.",sportsRelevance:"Gluteal strength is central to sprinting speed and jump height."},
relatedIds:["ANA-006"],source:"NCERT Human Anatomy",tags:["muscles"]},

{id:"ANA-006",exam:["UGC NET","SET"],subject:"Anatomy",topic:"Muscular System",difficulty:"Moderate",type:"MCQ",year:2022,
question:"Which type of muscle fibre is best suited for endurance activities like marathon running?",
options:["Type IIx (Fast Glycolytic)","Type IIa (Fast Oxidative Glycolytic)","Type I (Slow Oxidative)","Cardiac fibres"],correctIndex:2,
explanation:"Type I (Slow-Twitch/Slow Oxidative) fibres are fatigue-resistant, rely on aerobic metabolism, and are recruited for prolonged, low-intensity activity — ideal for marathon running.",
concept:{title:"Skeletal Muscle Fibre Types",definition:"Muscle fibres differ in contraction speed, fatigue resistance and metabolic pathway.",points:["Type I: slow, aerobic, fatigue-resistant — endurance","Type IIa: fast, intermediate — middle distance","Type IIx: fast, anaerobic, fatigues quickly — sprint/power"],memoryTrick:"'I is for endurance (Iron-man), II is for speed'.",sportsRelevance:"Elite marathoners often show 70-80% Type I fibres; sprinters show a higher proportion of Type II."},
relatedIds:["ANA-005","PHY-009"],source:"Exercise Physiology - McArdle",tags:["muscles","fibre-type"]},

{id:"ANA-007",exam:["KVS PGT","NVS"],subject:"Anatomy",topic:"Circulatory System",difficulty:"Easy",type:"MCQ",year:2021,
question:"The human heart has how many chambers?",
options:["Two","Three","Four","Six"],correctIndex:2,
explanation:"The human heart has four chambers — two atria (upper) and two ventricles (lower) — enabling separate pulmonary and systemic circulation.",
concept:{title:"Chambers of the Heart",definition:"Right atrium & ventricle handle deoxygenated blood; left atrium & ventricle handle oxygenated blood.",points:["Right side: pulmonary circuit","Left side: systemic circuit","Septum divides the two sides"],memoryTrick:"'2 receiving rooms (atria), 2 pumping rooms (ventricles)'.",sportsRelevance:"Cardiac output (heart rate × stroke volume) is central to aerobic sports performance."},
relatedIds:["PHY-001"],source:"NCERT Human Anatomy",tags:["circulatory"]},

{id:"ANA-008",exam:["UGC NET"],subject:"Anatomy",topic:"Respiratory System",difficulty:"Moderate",type:"MCQ",year:2024,
question:"The exchange of oxygen and carbon dioxide takes place in which structure of the lungs?",
options:["Bronchi","Bronchioles","Alveoli","Trachea"],correctIndex:2,
explanation:"Alveoli are tiny air sacs surrounded by capillaries where gaseous exchange (O2 in, CO2 out) occurs via diffusion across a thin membrane.",
concept:{title:"Site of Gas Exchange",definition:"Alveoli provide a huge surface area (~70m²) for efficient diffusion.",points:["Thin, moist alveolar walls aid diffusion","Surrounded by pulmonary capillaries","Surfactant prevents alveolar collapse"],memoryTrick:"'Alveoli = Air-exchange-oli' — the last stop for air.",sportsRelevance:"Altitude training increases alveolar efficiency and red blood cell count."},
relatedIds:["PHY-002"],source:"Guyton's Physiology",tags:["respiratory"]},

{id:"ANA-009",exam:["State PSC","B.P.Ed"],subject:"Anatomy",topic:"Nervous System",difficulty:"Moderate",type:"MCQ",year:2023,
question:"Which part of the brain is primarily responsible for coordination of voluntary movements and balance?",
options:["Cerebrum","Cerebellum","Medulla Oblongata","Hypothalamus"],correctIndex:1,
explanation:"The cerebellum ('little brain') coordinates voluntary movements such as posture, balance, and speech, ensuring smooth and accurate motor control.",
concept:{title:"Functional Brain Regions",definition:"Each brain region governs specific functions relevant to movement and cognition.",points:["Cerebrum: thought, voluntary action initiation","Cerebellum: balance & coordination","Medulla: involuntary functions (heartbeat, breathing)","Hypothalamus: temperature & hormone regulation"],memoryTrick:"'Cerebellum = balance beam' — think gymnastics balance.",sportsRelevance:"Cerebellar function is critical in gymnastics, diving and balance-dependent sports."},
relatedIds:["ANA-010"],source:"NCERT Human Anatomy",tags:["nervous-system"]},

{id:"ANA-010",exam:["UGC NET","M.P.Ed"],subject:"Anatomy",topic:"Nervous System",difficulty:"Hard",type:"MCQ",year:2022,
question:"Proprioceptors located in muscles that detect changes in muscle length are called:",
options:["Golgi Tendon Organs","Muscle Spindles","Pacinian Corpuscles","Ruffini Endings"],correctIndex:1,
explanation:"Muscle spindles are stretch receptors within the muscle belly that detect changes in muscle length and the rate of that change, triggering the stretch reflex.",
concept:{title:"Proprioceptors",definition:"Sensory receptors providing information about body position and movement.",points:["Muscle spindles: detect length/stretch changes","Golgi Tendon Organs: detect tension at musculotendinous junction","Both protect muscles from overstretching/overloading"],memoryTrick:"'Spindle = length, Golgi = tension (at joint-tendon)'.",sportsRelevance:"Proprioception training reduces ankle/knee injury risk in agility sports."},
relatedIds:["ANA-009","BIO-007"],source:"Kinesiology text",tags:["nervous-system","proprioception"]},

{id:"ANA-011",exam:["KVS PGT"],subject:"Anatomy",topic:"Skeletal System",difficulty:"Easy",type:"MCQ",year:2020,
question:"Which is the smallest bone in the human body?",
options:["Stapes","Malleus","Incus","Coccyx"],correctIndex:0,
explanation:"The stapes, located in the middle ear, is the smallest bone in the human body, roughly the size of a grain of rice, and transmits sound vibrations to the inner ear.",
concept:{title:"Ear Ossicles",definition:"Three tiny bones — malleus, incus, stapes — transmit sound from the eardrum to the inner ear.",points:["Malleus (hammer)","Incus (anvil)","Stapes (stirrup) — smallest bone"],memoryTrick:"'MIS' order from eardrum inward: Malleus-Incus-Stapes.",sportsRelevance:"Relevant in sports like diving/swimming where ear barotrauma can occur."},
relatedIds:["ANA-002"],source:"NCERT Human Anatomy",tags:["skeletal","ear"]},

{id:"ANA-012",exam:["DSSSB","UGC NET"],subject:"Anatomy",topic:"Muscular System",difficulty:"Moderate",type:"MCQ",year:2023,
question:"Isometric muscle contraction is best described as:",
options:["Muscle shortens while generating tension","Muscle lengthens while generating tension","Muscle generates tension without changing length","Muscle relaxes completely"],correctIndex:2,
explanation:"In an isometric contraction, muscle tension is generated without a visible change in muscle length or joint angle — e.g., holding a plank position.",
concept:{title:"Types of Muscle Contraction",definition:"Contractions are classified by whether/how muscle length changes.",points:["Isometric: no length change (plank, wall-sit)","Concentric: muscle shortens (lifting a weight up)","Eccentric: muscle lengthens under tension (lowering a weight)"],memoryTrick:"'Iso = same' (length stays same).",sportsRelevance:"Isometric holds are used in rehab and core-stability training for athletes."},
relatedIds:["ANA-005","TRN-004"],source:"Exercise Physiology - McArdle",tags:["muscles","contraction"]},

{id:"ANA-013",exam:["UGC NET","SET"],subject:"Anatomy",topic:"Circulatory System",difficulty:"Hard",type:"MCQ",year:2024,
question:"Which blood vessel carries oxygenated blood away from the heart but is technically classified as an exception among arteries?",
options:["Aorta","Pulmonary Artery","Coronary Artery","Renal Artery"],correctIndex:1,
explanation:"Although arteries typically carry oxygenated blood, the pulmonary artery is an exception — it carries deoxygenated blood from the right ventricle to the lungs.",
concept:{title:"Artery vs Vein Exceptions",definition:"Vessel classification (artery/vein) depends on direction of flow (away/toward heart), not oxygen content.",points:["Pulmonary artery: deoxygenated blood, heart → lungs","Pulmonary vein: oxygenated blood, lungs → heart","This is the key exception tested repeatedly in exams"],memoryTrick:"'Pulmonary is opposite' — remember this one exception and the rule holds everywhere else.",sportsRelevance:"Understanding circulation aids in explaining VO2 max and oxygen delivery during exercise."},
relatedIds:["ANA-007","PHY-003"],source:"Guyton's Physiology",tags:["circulatory"]},

{id:"ANA-014",exam:["KVS PGT","NVS"],subject:"Anatomy",topic:"Skeletal System",difficulty:"Moderate",type:"MCQ",year:2021,
question:"The vertebral column in an adult human typically consists of how many vertebrae?",
options:["24","26","33","30"],correctIndex:1,
explanation:"An adult vertebral column has 26 bones: 7 cervical + 12 thoracic + 5 lumbar + 1 sacrum (fused from 5) + 1 coccyx (fused from 3-5). At birth there are 33 separate segments before fusion.",
concept:{title:"Vertebral Column Regions",definition:"The spine is divided into 5 regions from top to bottom.",points:["Cervical (7) — neck","Thoracic (12) — mid-back, rib attachment","Lumbar (5) — lower back","Sacrum (5 fused) and Coccyx (4 fused)"],memoryTrick:"'Breakfast at 7, Lunch at 12, Dinner at 5' — 7 cervical, 12 thoracic, 5 lumbar.",sportsRelevance:"Lumbar spine injuries are common in weightlifting and gymnastics due to excessive flexion/extension loads."},
relatedIds:["ANA-002"],source:"NCERT Human Anatomy",tags:["skeletal","spine"]},

{id:"ANA-015",exam:["UGC NET"],subject:"Anatomy",topic:"Muscular System",difficulty:"Hard",type:"Match the Following",year:2023,
question:"Match the muscle (Column A) with its primary action (Column B):\nA) Biceps Brachii  B) Quadriceps  C) Gastrocnemius  D) Hamstrings\n1) Knee flexion  2) Elbow flexion  3) Plantar flexion  4) Knee extension",
options:["A-2, B-4, C-3, D-1","A-1, B-2, C-4, D-3","A-2, B-1, C-3, D-4","A-4, B-2, C-1, D-3"],correctIndex:0,
explanation:"Biceps Brachii flexes the elbow (2); Quadriceps extends the knee (4); Gastrocnemius plantar-flexes the ankle (3); Hamstrings flex the knee (1).",
concept:{title:"Prime Movers of Major Joints",definition:"Each major joint action has an associated 'prime mover' muscle group.",points:["Elbow flexion — Biceps Brachii","Knee extension — Quadriceps (Rectus Femoris + Vasti)","Ankle plantar flexion — Gastrocnemius/Soleus","Knee flexion — Hamstrings (Biceps Femoris, Semitendinosus, Semimembranosus)"],memoryTrick:"Pair opposite joint actions with opposite muscle groups (agonist-antagonist).",sportsRelevance:"Hamstring-to-quadriceps strength ratio is a key injury-prevention metric in sprinting."},
relatedIds:["ANA-005","ANA-012"],source:"Kinesiology text",tags:["muscles","match"]},

{id:"ANA-016",exam:["State PSC","DSSSB"],subject:"Anatomy",topic:"Digestive System",difficulty:"Easy",type:"MCQ",year:2020,
question:"Bile, which helps in the digestion of fats, is produced by the:",
options:["Pancreas","Liver","Gall Bladder","Stomach"],correctIndex:1,
explanation:"Bile is produced by the liver and stored/concentrated in the gall bladder before being released into the small intestine to emulsify fats.",
concept:{title:"Accessory Digestive Organs",definition:"Liver, gall bladder and pancreas support digestion without food passing through them.",points:["Liver: produces bile","Gall bladder: stores bile","Pancreas: produces digestive enzymes + insulin"],memoryTrick:"'Liver makes, gall bladder keeps'.",sportsRelevance:"Fat metabolism efficiency matters in ultra-endurance sports nutrition."},
relatedIds:["NUT-002"],source:"NCERT Human Anatomy",tags:["digestive"]},

{id:"ANA-017",exam:["UGC NET","M.P.Ed"],subject:"Anatomy",topic:"Joints",difficulty:"Moderate",type:"MCQ",year:2022,
question:"Which movement describes moving a limb away from the midline of the body?",
options:["Adduction","Abduction","Circumduction","Rotation"],correctIndex:1,
explanation:"Abduction is movement away from the body's midline (e.g., raising the arm sideways). Adduction is the opposite — movement toward the midline.",
concept:{title:"Anatomical Movement Terms",definition:"Standard terminology describes joint movements relative to anatomical position.",points:["Abduction: away from midline","Adduction: toward midline","Flexion: decreases joint angle","Extension: increases joint angle"],memoryTrick:"'ABduct = taken AWAY' (like a kidnapping, moved away).",sportsRelevance:"Used constantly in coaching cues, e.g., 'abduct the hip' in agility drills."},
relatedIds:["ANA-003"],source:"Essentials of Anatomy & Physiology",tags:["joints","terminology"]},

{id:"ANA-018",exam:["KVS PGT","UGC NET"],subject:"Anatomy",topic:"Circulatory System",difficulty:"Moderate",type:"MCQ",year:2024,
question:"The average resting heart rate of a healthy adult is:",
options:["40-60 beats/min","60-100 beats/min","100-120 beats/min","120-140 beats/min"],correctIndex:1,
explanation:"A normal resting heart rate for adults ranges from 60-100 beats per minute. Well-trained endurance athletes often have lower resting rates (40-60 bpm) due to cardiac adaptation.",
concept:{title:"Resting Heart Rate (RHR)",definition:"The number of heartbeats per minute while at complete rest.",points:["Normal adult range: 60-100 bpm","Trained athletes: often 40-60 bpm (bradycardia of fitness)","Measured best first thing in the morning"],memoryTrick:"'60 to 100 is the norm for the everyday form'.",sportsRelevance:"RHR is a simple marker coaches use to monitor cardiovascular fitness and overtraining."},
relatedIds:["ANA-007","PHY-001"],source:"ACSM Guidelines",tags:["circulatory","heart-rate"]},

{id:"PHY-001",exam:["UGC NET","KVS PGT"],subject:"Physiology",topic:"Cardiovascular Physiology",difficulty:"Moderate",type:"MCQ",year:2023,
question:"Cardiac output is the product of:",
options:["Heart rate × Blood pressure","Stroke volume × Blood pressure","Heart rate × Stroke volume","Stroke volume × Respiratory rate"],correctIndex:2,
explanation:"Cardiac Output (Q) = Heart Rate (HR) × Stroke Volume (SV). It represents the total volume of blood pumped by the heart per minute.",
concept:{title:"Cardiac Output",definition:"Q = HR × SV, typically ~5L/min at rest, can rise to 20-40L/min during maximal exercise in trained athletes.",points:["Resting CO: ~5 L/min","Elite endurance athletes: up to 40 L/min at max effort","Trained hearts increase CO mainly via higher stroke volume"],memoryTrick:"'Q = HR × SV' — remember Q for Quantity of blood pumped.",sportsRelevance:"Higher stroke volume (bigger, more efficient heart) is a hallmark of endurance-trained athletes."},
relatedIds:["ANA-007","PHY-006"],source:"Exercise Physiology - McArdle",tags:["cardiovascular"]},

{id:"PHY-002",exam:["UGC NET","SET"],subject:"Physiology",topic:"Respiratory Physiology",difficulty:"Hard",type:"MCQ",year:2024,
question:"VO2 Max is best defined as:",
options:["The volume of air inhaled per breath","The maximum rate of oxygen consumption during intense exercise","The total lung capacity","The oxygen saturation of blood"],correctIndex:1,
explanation:"VO2 Max is the maximum rate at which the body can consume and utilize oxygen during incremental exercise, widely regarded as the best single indicator of cardiorespiratory/aerobic fitness.",
concept:{title:"VO2 Max",definition:"Maximal oxygen uptake, measured in ml/kg/min, reflecting the combined efficiency of lungs, heart, blood and muscles.",points:["Elite endurance athletes: 70-85 ml/kg/min","Average untrained adult: 35-45 ml/kg/min","Measured via graded exercise tests (e.g., Bruce Protocol)","Estimated indirectly via Cooper 12-min run test"],memoryTrick:"'VO2 Max = engine size' — bigger aerobic engine, better endurance.",sportsRelevance:"Central selection/testing metric for endurance sports like distance running, cycling, cross-country skiing."},
relatedIds:["TME-004","ANA-006"],source:"ACSM Guidelines",tags:["aerobic-capacity"]},

{id:"PHY-003",exam:["KVS PGT","DSSSB"],subject:"Physiology",topic:"Energy Systems",difficulty:"Moderate",type:"MCQ",year:2022,
question:"Which energy system is primarily used during a 100m sprint?",
options:["Aerobic system","ATP-PC (Phosphagen) system","Anaerobic Glycolytic system","Beta-oxidation"],correctIndex:1,
explanation:"The ATP-PC (phosphagen) system provides immediate, high-power energy for activities lasting up to ~10 seconds, such as a 100m sprint, without needing oxygen.",
concept:{title:"Three Energy Systems",definition:"The body uses three interacting systems depending on exercise duration/intensity.",points:["ATP-PC: 0-10 sec, explosive (100m sprint, shot put)","Anaerobic Glycolysis: 10sec-2min (400m run)","Aerobic system: 2min+ (marathon, endurance sports)"],memoryTrick:"'PC = Phosphocreatine = Power & quiCk'.",sportsRelevance:"Training design (interval length/rest ratios) is built around targeting the right energy system."},
relatedIds:["ANA-006","TRN-002"],source:"Exercise Physiology - McArdle",tags:["energy-systems"]},

{id:"PHY-004",exam:["UGC NET"],subject:"Physiology",topic:"Energy Systems",difficulty:"Hard",type:"MCQ",year:2023,
question:"Lactate threshold refers to the point during exercise at which:",
options:["Muscle glycogen is fully depleted","Blood lactate begins to accumulate faster than it can be cleared","The heart reaches maximum heart rate","Oxygen consumption plateaus (VO2 Max is reached)"],correctIndex:1,
explanation:"The lactate threshold (or anaerobic threshold) marks the exercise intensity at which blood lactate accumulates faster than the body can clear it, causing a sharp rise in blood lactate concentration.",
concept:{title:"Lactate Threshold",definition:"A key marker of endurance performance, often more predictive of race performance than VO2 Max alone.",points:["Untrained individuals: ~50-60% of VO2 Max","Elite endurance athletes: 80-90% of VO2 Max","Training at/near threshold improves fat utilization and delays fatigue"],memoryTrick:"'Threshold = the tipping point where lactate piles up faster than it clears'.",sportsRelevance:"Marathon pacing strategy is built around staying just under lactate threshold."},
relatedIds:["PHY-002","PHY-003"],source:"Exercise Physiology - McArdle",tags:["lactate","endurance"]},

{id:"PHY-005",exam:["KVS PGT","NVS"],subject:"Physiology",topic:"Thermoregulation",difficulty:"Moderate",type:"MCQ",year:2021,
question:"The primary mechanism the body uses to dissipate heat during intense exercise is:",
options:["Shivering","Vasoconstriction","Sweating (evaporative cooling)","Piloerection"],correctIndex:2,
explanation:"During exercise, sweating is the body's main cooling mechanism — as sweat evaporates from the skin, it removes heat, helping maintain core temperature.",
concept:{title:"Thermoregulation During Exercise",definition:"The body balances heat production (from muscle work) with heat loss mechanisms.",points:["Evaporation (sweating) — primary mechanism during exercise","Radiation & Convection — secondary, less effective in humid heat","Dehydration impairs sweating efficiency and raises injury/heat-illness risk"],memoryTrick:"'Sweat it out' — evaporation is the exercise-specific cooling method.",sportsRelevance:"Hydration strategy and heat acclimatization are critical for endurance events in hot climates."},
relatedIds:["NUT-003","FA-001"],source:"ACSM Guidelines",tags:["thermoregulation"]},

{id:"PHY-006",exam:["UGC NET","SET"],subject:"Physiology",topic:"Cardiovascular Physiology",difficulty:"Moderate",type:"MCQ",year:2022,
question:"The Karvonen formula is used to calculate:",
options:["Body Mass Index","Target Heart Rate using Heart Rate Reserve","Basal Metabolic Rate","VO2 Max directly"],correctIndex:1,
explanation:"The Karvonen formula calculates Target Heart Rate as: THR = ((HRmax − HRrest) × %Intensity) + HRrest, using Heart Rate Reserve (HRR) for more individualized training zones.",
concept:{title:"Karvonen Formula",definition:"THR = ((HRmax − HRrest) × Intensity%) + HRrest",points:["HRmax commonly estimated as 220 − age","Uses Heart Rate Reserve (HRmax − HRrest) rather than HRmax alone","More accurate for individualized training zones than % of HRmax alone"],memoryTrick:"'Karvonen adds back the Resting rate' — reserve method, not straight percentage.",sportsRelevance:"Used by coaches to prescribe personalized cardio training zones."},
relatedIds:["FML-002","PHY-001"],source:"ACSM Guidelines",tags:["formula","heart-rate"]},

{id:"PHY-007",exam:["DSSSB","State PSC"],subject:"Physiology",topic:"Muscle Physiology",difficulty:"Easy",type:"MCQ",year:2020,
question:"Delayed Onset Muscle Soreness (DOMS) typically peaks:",
options:["Immediately after exercise","6-12 hours after exercise","24-72 hours after exercise","One week after exercise"],correctIndex:2,
explanation:"DOMS is caused by microtrauma to muscle fibres (especially from eccentric contractions) and typically peaks 24-72 hours post-exercise before subsiding.",
concept:{title:"DOMS",definition:"Muscle soreness resulting from unfamiliar or high-intensity eccentric exercise.",points:["Peaks at 24-72 hours","Caused by microscopic muscle fibre damage & inflammation","Different from acute muscle fatigue (which is immediate)"],memoryTrick:"'DOMS = Delayed' — the clue is in the name, not immediate.",sportsRelevance:"Coaches schedule recovery/light sessions 1-3 days after heavy eccentric training to manage DOMS."},
relatedIds:["ANA-012","INJ-001"],source:"Exercise Physiology - McArdle",tags:["recovery"]},

{id:"PHY-008",exam:["UGC NET"],subject:"Physiology",topic:"Respiratory Physiology",difficulty:"Hard",type:"MCQ",year:2024,
question:"The volume of air that can be forcibly exhaled after a maximal inhalation is called:",
options:["Tidal Volume","Residual Volume","Vital Capacity","Total Lung Capacity"],correctIndex:2,
explanation:"Vital Capacity is the maximum amount of air that can be exhaled after a maximal inhalation. It equals Total Lung Capacity minus Residual Volume.",
concept:{title:"Lung Volumes & Capacities",definition:"Lung function is measured using standard volumes and capacities.",points:["Tidal Volume: normal breath in/out (~500ml)","Vital Capacity: max exhale after max inhale","Residual Volume: air remaining after max exhale (cannot be measured by spirometry alone)","Total Lung Capacity: Vital Capacity + Residual Volume"],memoryTrick:"'Vital = everything you CAN breathe out'.",sportsRelevance:"Swimmers and divers train to maximize vital capacity for breath control."},
relatedIds:["ANA-008"],source:"Guyton's Physiology",tags:["respiratory"]},

{id:"PHY-009",exam:["KVS PGT","UGC NET"],subject:"Physiology",topic:"Energy Systems",difficulty:"Moderate",type:"MCQ",year:2023,
question:"Which of the following best describes 'EPOC' (Excess Post-exercise Oxygen Consumption)?",
options:["Oxygen deficit at the start of exercise","Elevated oxygen consumption after exercise ends, to restore the body to resting state","The amount of oxygen inhaled during exercise","Oxygen consumed during warm-up"],correctIndex:1,
explanation:"EPOC, often called the 'afterburn effect', is the elevated oxygen consumption following exercise as the body restores ATP-PC stores, clears lactate, and returns to homeostasis.",
concept:{title:"EPOC (Afterburn Effect)",definition:"The metabolic cost of recovery after exercise, contributing to post-workout calorie expenditure.",points:["Fast component: replenish ATP-PC, myoglobin oxygen stores","Slow component: lactate removal, elevated body temp/hormones","HIIT produces greater EPOC than steady-state cardio"],memoryTrick:"'EPOC = the bill you pay after the workout'.",sportsRelevance:"A key rationale behind HIIT programming for fat loss."},
relatedIds:["PHY-003","TRN-006"],source:"Exercise Physiology - McArdle",tags:["energy-systems","recovery"]},

{id:"PHY-010",exam:["UGC NET","M.P.Ed"],subject:"Physiology",topic:"Cardiovascular Physiology",difficulty:"Hard",type:"MCQ",year:2022,
question:"Bradycardia commonly observed in highly trained endurance athletes is primarily due to:",
options:["Weakened heart muscle","Increased stroke volume and parasympathetic (vagal) dominance","Reduced blood volume","Dehydration"],correctIndex:1,
explanation:"Chronic endurance training increases stroke volume (more blood pumped per beat) and enhances parasympathetic (vagal) tone, allowing a lower resting heart rate to maintain the same cardiac output — a normal, healthy adaptation called 'athlete's heart'.",
concept:{title:"Athlete's Bradycardia",definition:"A benign training adaptation, not a pathology, seen in well-conditioned endurance athletes.",points:["Resting HR can drop to 40-50 bpm or lower","Caused by larger, more efficient heart + higher vagal tone","Distinct from pathological bradycardia"],memoryTrick:"'Efficient heart = fewer, stronger beats needed'.",sportsRelevance:"Common in marathoners, cyclists, and cross-country skiers; monitored to distinguish fitness from illness."},
relatedIds:["ANA-018","PHY-001"],source:"ACSM Guidelines",tags:["cardiovascular","adaptation"]},

{id:"PHY-011",exam:["DSSSB","KVS PGT"],subject:"Physiology",topic:"Muscle Physiology",difficulty:"Moderate",type:"MCQ",year:2021,
question:"The 'all-or-none law' in muscle physiology states that:",
options:["A muscle either contracts fully or not at all in response to a stimulus of adequate strength","All muscles contract simultaneously","Muscles either grow or atrophy, with no middle ground","A muscle fibre can partially contract depending on stimulus strength"],correctIndex:0,
explanation:"The all-or-none law applies to individual muscle fibres: once a stimulus reaches threshold, the fibre contracts maximally; below threshold, there is no contraction at all — intensity of overall muscle force is instead controlled by recruiting more/fewer motor units.",
concept:{title:"All-or-None Law",definition:"Applies at the level of a single muscle fibre or motor unit, not the whole muscle.",points:["Sub-threshold stimulus = no contraction","Threshold or supra-threshold = full contraction of that fibre","Overall force is graded by recruiting more motor units, not partial fibre contraction"],memoryTrick:"'All or none' = one fibre never contracts 'a little bit'.",sportsRelevance:"Explains why heavier resistance training recruits more motor units for greater force output."},
relatedIds:["ANA-010"],source:"Guyton's Physiology",tags:["muscle-physiology"]},

{id:"PHY-012",exam:["UGC NET","SET"],subject:"Physiology",topic:"Basal Metabolism",difficulty:"Moderate",type:"MCQ",year:2024,
question:"Basal Metabolic Rate (BMR) refers to:",
options:["Energy expended during vigorous exercise","The minimum energy required to maintain basic physiological functions at rest","The total daily energy expenditure including activity","The energy used in digesting food"],correctIndex:1,
explanation:"BMR is the amount of energy (calories) the body needs to maintain basic life-sustaining functions (breathing, circulation, cell production) while at complete rest.",
concept:{title:"Basal Metabolic Rate",definition:"BMR typically accounts for 60-75% of total daily energy expenditure.",points:["Measured under strict resting, fasting, thermoneutral conditions","Affected by age, sex, muscle mass, hormones","Muscle mass raises BMR (metabolically active tissue)"],memoryTrick:"'Basal = baseline, just to stay alive'.",sportsRelevance:"Athletes with higher muscle mass generally have a higher BMR, affecting nutrition planning."},
relatedIds:["FML-003","NUT-001"],source:"ACSM Guidelines",tags:["metabolism","formula"]},

{id:"PHY-013",exam:["KVS PGT","UGC NET"],subject:"Physiology",topic:"Respiratory Physiology",difficulty:"Easy",type:"MCQ",year:2020,
question:"Which gas makes up approximately 78% of atmospheric air?",
options:["Oxygen","Nitrogen","Carbon Dioxide","Argon"],correctIndex:1,
explanation:"Nitrogen makes up about 78% of the atmosphere, with oxygen at ~21% and the remainder being trace gases like argon and CO2.",
concept:{title:"Composition of Atmospheric Air",definition:"Understanding air composition is basic to respiratory and altitude physiology.",points:["Nitrogen: ~78%","Oxygen: ~21%","Carbon Dioxide & other trace gases: ~1%"],memoryTrick:"'78-21-1' — Nitrogen, Oxygen, Others.",sportsRelevance:"At altitude, the percentage stays the same but partial pressure of oxygen drops, affecting performance."},
relatedIds:["PHY-002"],source:"Guyton's Physiology",tags:["respiratory"]},

{id:"PHY-014",exam:["UGC NET"],subject:"Physiology",topic:"Energy Systems",difficulty:"Hard",type:"MCQ",year:2023,
question:"During prolonged low-to-moderate intensity exercise (e.g., a 3-hour cycling ride), the body predominantly relies on which fuel source as duration increases?",
options:["Muscle glycogen throughout","ATP-PC system","Fat (free fatty acid) oxidation","Protein exclusively"],correctIndex:2,
explanation:"As exercise duration increases at low-to-moderate intensity, the body shifts increasingly toward fat oxidation to spare limited glycogen stores, a key principle behind endurance fuelling strategy.",
concept:{title:"Fuel Utilization & Duration",definition:"The crossover concept: as intensity rises, carbohydrate use dominates; as duration rises at sub-maximal intensity, fat use increases.",points:["Short/high-intensity: carbohydrate (glycolysis) dominant","Long/low-intensity: fat oxidation dominant","Training increases the body's capacity to use fat at higher intensities ('glycogen sparing')"],memoryTrick:"'Fat burns slow and steady, carbs burn fast and hot'.",sportsRelevance:"Basis for carbohydrate-loading and fat-adaptation strategies in ultra-endurance sports."},
relatedIds:["PHY-003","NUT-004"],source:"Exercise Physiology - McArdle",tags:["energy-systems","nutrition"]},

// ----------------------------------------------------------- SPORTS TRAINING --
{id:"TRN-001",exam:["UGC NET","KVS PGT"],subject:"Sports Training",topic:"Training Principles",difficulty:"Easy",type:"MCQ",year:2023,
question:"The training principle stating that the body adapts specifically to the type of demand placed on it is called:",
options:["Overload","Specificity (SAID Principle)","Reversibility","Individual Differences"],correctIndex:1,
explanation:"The SAID Principle (Specific Adaptation to Imposed Demand) states that the body adapts specifically to the type, intensity and pattern of training stress applied — e.g., swimming training primarily improves swimming performance.",
concept:{title:"SAID Principle",definition:"Training adaptations are specific to the muscles used, energy systems trained, and movement patterns practiced.",points:["Also called 'Specificity'","Applies to muscle groups, energy systems, and skill patterns","Basis for sport-specific conditioning"],memoryTrick:"'SAID: Specific Adaptation to Imposed Demand' — you get what you train for.",sportsRelevance:"A footballer's training should mimic football's movement demands more than generic gym work."},
relatedIds:["TRN-002","TRN-003"],source:"Principles of Sports Training - Uppal",tags:["training-principles"]},

{id:"TRN-002",exam:["UGC NET","DSSSB"],subject:"Sports Training",topic:"Training Methods",difficulty:"Moderate",type:"MCQ",year:2022,
question:"'Fartlek' training is best described as:",
options:["A strict interval training with fixed rest periods","A form of continuous training with random changes in speed/terrain ('speed play')","A method exclusively for strength training","A tapering strategy before competition"],correctIndex:1,
explanation:"Fartlek (Swedish for 'speed play') is a training method combining continuous running with unstructured variations in pace and terrain, blending aerobic and anaerobic training.",
concept:{title:"Fartlek Training",definition:"An unstructured, intuitive endurance training method developed in Sweden in the 1930s.",points:["Combines fast bursts with slower recovery jogs, without fixed intervals","Trains both aerobic and anaerobic systems","Often done on varied natural terrain"],memoryTrick:"'Fartlek = Speed Play' — literal Swedish translation.",sportsRelevance:"Popular among middle/long-distance runners and football players for race-pace variability training."},
relatedIds:["TRN-003","PHY-003"],source:"Principles of Sports Training - Uppal",tags:["training-methods"]},

{id:"TRN-003",exam:["KVS PGT","UGC NET"],subject:"Sports Training",topic:"Training Methods",difficulty:"Moderate",type:"MCQ",year:2021,
question:"Interval training is characterized primarily by:",
options:["Continuous exercise without rest","Alternating periods of high-intensity work with planned rest/recovery intervals","Only low-intensity long-duration work","Exclusive use of weights"],correctIndex:1,
explanation:"Interval training alternates work bouts (high intensity) with structured recovery periods, allowing greater total high-intensity work than continuous training alone.",
concept:{title:"Interval Training",definition:"A method manipulating work:rest ratios to target specific energy systems.",points:["Variables: work duration, intensity, rest duration, number of reps/sets","Short intervals (<30s) target ATP-PC system","Longer intervals (2-5 min) target aerobic/anaerobic glycolytic systems"],memoryTrick:"'Interval = interruption' — work is interrupted by planned rest.",sportsRelevance:"Widely used across nearly all sports to build both speed and endurance simultaneously."},
relatedIds:["TRN-002","PHY-003"],source:"Principles of Sports Training - Uppal",tags:["training-methods"]},

{id:"TRN-004",exam:["UGC NET","SET"],subject:"Sports Training",topic:"Strength Training",difficulty:"Hard",type:"MCQ",year:2024,
question:"Plyometric training primarily develops which quality?",
options:["Flexibility","Explosive power via the stretch-shortening cycle","Aerobic endurance","Balance only"],correctIndex:1,
explanation:"Plyometric training uses the stretch-shortening cycle (rapid eccentric stretch immediately followed by a concentric contraction) to develop explosive power, as in bounding, depth jumps and hopping drills.",
concept:{title:"Plyometric Training",definition:"Exercises that exploit the stretch-shortening cycle to maximize force production in minimal time.",points:["Stretch-Shortening Cycle: eccentric phase → amortization phase → concentric phase","Examples: depth jumps, bounding, medicine ball throws","Requires adequate strength base before introduction to reduce injury risk"],memoryTrick:"'Plyo = explosive rebound' — like a spring loading and releasing.",sportsRelevance:"Central to improving vertical jump in basketball/volleyball and sprint start power."},
relatedIds:["TRN-001","BIO-003"],source:"Principles of Sports Training - Uppal",tags:["strength","power"]},

{id:"TRN-005",exam:["KVS PGT","DSSSB"],subject:"Sports Training",topic:"Periodization",difficulty:"Hard",type:"MCQ",year:2023,
question:"In periodization, the phase focused on peaking performance for a major competition is called the:",
options:["Preparatory Phase","Transition Phase","Competition Phase (Peaking)","General Conditioning Phase"],correctIndex:2,
explanation:"The Competition (or Peaking) Phase is designed to maximize performance readiness for competition through reduced volume, maintained/increased intensity, and tapering.",
concept:{title:"Periodization Phases",definition:"A long-term training plan divided into macro/meso/microcycles to manage training load and peak at the right time.",points:["Preparatory Phase: build general & specific fitness base","Competition Phase: taper volume, sharpen intensity, peak","Transition Phase: active recovery after competition season"],memoryTrick:"'Prepare, Peak, Pause' — the 3-phase cycle.",sportsRelevance:"Coaches use periodization to ensure athletes peak for Olympics/Nationals, not mid-season."},
relatedIds:["TRN-001","TRN-006"],source:"Principles of Sports Training - Uppal",tags:["periodization"]},

{id:"TRN-006",exam:["UGC NET"],subject:"Sports Training",topic:"Training Principles",difficulty:"Moderate",type:"MCQ",year:2022,
question:"Which principle explains the loss of fitness gains when training stops or is significantly reduced?",
options:["Overload","Reversibility (Detraining)","Progression","Specificity"],correctIndex:1,
explanation:"The Reversibility principle ('use it or lose it') states that training adaptations are lost when training stops or intensity/volume drops significantly, typically within weeks.",
concept:{title:"Reversibility / Detraining",definition:"Fitness gains regress toward baseline without continued training stimulus.",points:["Cardiovascular fitness can decline noticeably within 2-4 weeks of inactivity","Strength is generally lost more slowly than aerobic fitness","Relevant to injury layoffs and off-season planning"],memoryTrick:"'Reversibility reverses your results'.",sportsRelevance:"Explains why athletes need maintenance training even during rest/injury periods."},
relatedIds:["TRN-001","TRN-005"],source:"Principles of Sports Training - Uppal",tags:["training-principles"]},

{id:"TRN-007",exam:["UGC NET","KVS PGT"],subject:"Sports Training",topic:"Fitness Components",difficulty:"Easy",type:"MCQ",year:2021,
question:"Which of the following is NOT one of the five health-related components of physical fitness?",
options:["Cardiorespiratory Endurance","Muscular Strength","Agility","Body Composition"],correctIndex:2,
explanation:"Agility is a skill-related (motor) fitness component, not health-related. The five health-related components are cardiorespiratory endurance, muscular strength, muscular endurance, flexibility, and body composition.",
concept:{title:"Health-Related vs Skill-Related Fitness",definition:"Fitness components split into those affecting health outcomes vs those affecting sports performance.",points:["Health-related: cardio endurance, strength, muscular endurance, flexibility, body composition","Skill-related: agility, balance, coordination, speed, power, reaction time"],memoryTrick:"'Health = 5, Skill = 6' — different lists, don't mix them.",sportsRelevance:"Fitness test batteries (like AAHPERD) are built around these two categories."},
relatedIds:["TME-001"],source:"Uppal - Physical Fitness & Wellness",tags:["fitness-components"]},

{id:"TRN-008",exam:["UGC NET","SET"],subject:"Sports Training",topic:"Strength Training",difficulty:"Moderate",type:"MCQ",year:2023,
question:"To develop maximum strength, training programs typically prescribe:",
options:["Low load (40-50% 1RM), high reps (20+)","High load (85%+ 1RM), low reps (1-6)","Bodyweight only exercises","Continuous low-intensity cardio"],correctIndex:1,
explanation:"Maximum strength development is best achieved with high loads (85%+ of 1-Rep Max) and low repetitions (typically 1-6), allowing near-maximal neuromuscular recruitment.",
concept:{title:"Strength Training Zones",definition:"Different load/rep ranges target different adaptations.",points:["1-6 reps @ 85%+ 1RM: maximum strength","6-12 reps @ 67-85% 1RM: hypertrophy","12+ reps @ <67% 1RM: muscular endurance"],memoryTrick:"'Low reps, heavy weight = raw strength'.",sportsRelevance:"Powerlifters and throwers train in the low-rep/high-load range; bodybuilders in the moderate range."},
relatedIds:["TRN-004","FML-005"],source:"NSCA Essentials of Strength Training",tags:["strength"]},

{id:"TRN-009",exam:["KVS PGT","UGC NET"],subject:"Sports Training",topic:"Flexibility Training",difficulty:"Moderate",type:"MCQ",year:2022,
question:"Which stretching method involves a contract-relax sequence, often with a partner, to improve range of motion?",
options:["Static Stretching","Ballistic Stretching","Proprioceptive Neuromuscular Facilitation (PNF)","Dynamic Stretching"],correctIndex:2,
explanation:"PNF stretching uses alternating contraction and relaxation of the target muscle (often with partner-assisted resistance) to achieve greater range of motion than static stretching alone.",
concept:{title:"Stretching Methods",definition:"Different stretching techniques suit different training goals and timing.",points:["Static: hold a stretch position (post-workout/cool-down)","Dynamic: controlled movement through range of motion (warm-up)","Ballistic: bouncing movements (higher injury risk)","PNF: contract-relax, most effective for ROM gains but needs a partner/coach"],memoryTrick:"'PNF = Partner-Needed Flexibility' (informal memory aid).",sportsRelevance:"PNF is commonly used by gymnasts and martial artists needing extreme flexibility."},
relatedIds:["TRN-007"],source:"NSCA Essentials of Strength Training",tags:["flexibility"]},

{id:"TRN-010",exam:["UGC NET"],subject:"Sports Training",topic:"Training Load",difficulty:"Hard",type:"MCQ",year:2024,
question:"The 10% Rule in training load management suggests:",
options:["Never increase training volume","Weekly training volume/intensity should not increase by more than ~10% to avoid overuse injury","Athletes should rest 10% of the year","Only 10% of training should be sport-specific"],correctIndex:1,
explanation:"The 10% Rule is a guideline suggesting that weekly training load (distance, volume, or intensity) should not increase by more than approximately 10% from the previous week, to minimize overuse injury risk.",
concept:{title:"10% Rule",definition:"A conservative load-progression guideline, particularly popular in running and endurance sports.",points:["Applies to volume, distance, or intensity increases","Helps prevent overuse injuries like stress fractures and tendinopathies","Should be combined with adequate recovery weeks"],memoryTrick:"'10% - not 100%' — gradual, not aggressive jumps.",sportsRelevance:"Widely taught to prevent overtraining syndrome and stress injuries in distance runners."},
relatedIds:["TRN-006","INJ-003"],source:"Principles of Sports Training - Uppal",tags:["training-load","injury-prevention"]},

{id:"TRN-011",exam:["KVS PGT","DSSSB"],subject:"Sports Training",topic:"Warm-up & Cool-down",difficulty:"Easy",type:"MCQ",year:2020,
question:"The primary purpose of a cool-down after intense exercise is to:",
options:["Increase heart rate further","Gradually return heart rate and blood pressure to resting levels and aid recovery","Build muscle mass","Improve maximum strength"],correctIndex:1,
explanation:"A cool-down (light activity + stretching) helps gradually lower heart rate and blood pressure, assists in clearing metabolic byproducts like lactate, and reduces the risk of blood pooling.",
concept:{title:"Cool-Down",definition:"A structured wind-down period following the main exercise bout.",points:["Prevents venous blood pooling (which can cause dizziness)","Gradually normalizes heart rate/breathing","Often includes light aerobic activity + static stretching"],memoryTrick:"'Cool down = bring it down slowly, not a sudden stop'.",sportsRelevance:"Essential after competitive matches to begin the recovery process for the next session."},
relatedIds:["TRN-009","PHY-007"],source:"Uppal - Physical Fitness & Wellness",tags:["warm-up","recovery"]},

{id:"TRN-012",exam:["UGC NET","M.P.Ed"],subject:"Sports Training",topic:"Training Principles",difficulty:"Moderate",type:"MCQ",year:2023,
question:"Progressive Overload refers to:",
options:["Keeping training load constant for long periods","Gradually and systematically increasing training demands to continue adaptation","Reducing training load every session","Training different muscle groups randomly"],correctIndex:1,
explanation:"Progressive Overload means systematically increasing training stress (volume, intensity, frequency, or complexity) over time to continue driving physiological adaptation, since the body adapts to a constant stimulus and improvement plateaus.",
concept:{title:"Progressive Overload",definition:"A foundational training principle — without increasing demand over time, adaptation stalls.",points:["Can be manipulated via load, reps, sets, frequency, or reduced rest","Must be applied gradually to avoid overtraining/injury","Works alongside the 10% Rule for safe progression"],memoryTrick:"'Progressive = step by step, not a leap'.",sportsRelevance:"The core principle behind all long-term athletic development programs."},
relatedIds:["TRN-010","TRN-001"],source:"NSCA Essentials of Strength Training",tags:["training-principles"]},

{id:"PSY-001",exam:["UGC NET","KVS PGT"],subject:"Sports Psychology",topic:"Motivation",difficulty:"Easy",type:"MCQ",year:2023,
question:"Motivation that comes from internal satisfaction (enjoyment, mastery) rather than external rewards is called:",
options:["Extrinsic Motivation","Intrinsic Motivation","Achievement Motivation","Social Motivation"],correctIndex:1,
explanation:"Intrinsic motivation arises from internal factors — enjoyment, personal satisfaction, love of the activity — rather than external rewards like medals or money (extrinsic motivation).",
concept:{title:"Intrinsic vs Extrinsic Motivation",definition:"Two broad categories describing the source of an athlete's drive to participate.",points:["Intrinsic: enjoyment, mastery, self-improvement","Extrinsic: trophies, money, praise, scholarships","Over-reliance on extrinsic rewards can undermine intrinsic motivation ('overjustification effect')"],memoryTrick:"'Intrinsic = INside you'.",sportsRelevance:"Long-term athlete development models emphasize building intrinsic motivation for sustained participation."},
relatedIds:["PSY-002"],source:"Sports Psychology - Weinberg & Gould",tags:["motivation"]},

{id:"PSY-002",exam:["UGC NET","SET"],subject:"Sports Psychology",topic:"Arousal & Anxiety",difficulty:"Hard",type:"MCQ",year:2024,
question:"The Inverted-U Hypothesis in sports psychology suggests that:",
options:["Performance improves linearly as arousal increases","Performance is best at low arousal only","Performance is optimal at a moderate level of arousal; too little or too much impairs performance","Arousal has no effect on performance"],correctIndex:2,
explanation:"The Inverted-U Hypothesis (Yerkes-Dodson Law) proposes that performance improves with increasing arousal up to an optimal point, beyond which further arousal causes performance to decline — forming an inverted U-shaped curve.",
concept:{title:"Inverted-U Hypothesis",definition:"Also known as the Yerkes-Dodson Law, relating arousal level to performance quality.",points:["Low arousal: under-motivated, sluggish performance","Optimal arousal: peak performance zone","High arousal: anxiety, tension, decreased performance","Optimal point varies by task complexity and individual"],memoryTrick:"Picture an upside-down 'U' — performance peaks in the middle, not at the extremes.",sportsRelevance:"Coaches manage pre-competition arousal (via psyching-up or calming techniques) to hit the athlete's optimal zone."},
relatedIds:["PSY-003","PSY-001"],source:"Sports Psychology - Weinberg & Gould",tags:["arousal","anxiety"]},

{id:"PSY-003",exam:["UGC NET","KVS PGT"],subject:"Sports Psychology",topic:"Personality",difficulty:"Moderate",type:"MCQ",year:2022,
question:"Which personality trait theory suggests behavior is consistent across situations due to stable inner traits?",
options:["Situation Theory","Trait Theory","Interactional Theory","Social Learning Theory"],correctIndex:1,
explanation:"Trait Theory holds that personality is composed of relatively stable, enduring characteristics that predict behavior consistently across different situations, including sport settings.",
concept:{title:"Approaches to Personality",definition:"Sports psychology draws on several theoretical models to explain athlete personality and behavior.",points:["Trait Theory: stable traits predict behavior","Situation Theory: behavior driven by the environment/situation","Interactional Theory: behavior results from trait × situation interaction (most widely accepted today)"],memoryTrick:"'Trait = Terrain stays the same' — consistent regardless of situation.",sportsRelevance:"Talent identification programs sometimes use personality profiling based on these theories."},
relatedIds:["PSY-001"],source:"Sports Psychology - Weinberg & Gould",tags:["personality"]},

{id:"PSY-004",exam:["UGC NET"],subject:"Sports Psychology",topic:"Goal Setting",difficulty:"Moderate",type:"MCQ",year:2023,
question:"In goal-setting theory, which type of goal focuses on personal improvement rather than beating others?",
options:["Outcome Goal","Performance Goal","Social Goal","Competitive Goal"],correctIndex:1,
explanation:"Performance goals focus on an athlete's own standards and personal improvement (e.g., improving personal best time), as opposed to outcome goals which focus on results relative to others (winning/losing).",
concept:{title:"Types of Goals",definition:"Goal-setting in sport is generally categorized into three types.",points:["Outcome goals: winning, beating opponents (less controllable)","Performance goals: personal standards, times, scores (more controllable)","Process goals: technique/execution focus during performance"],memoryTrick:"'Performance = Personal', 'Outcome = Opponent'.",sportsRelevance:"Sport psychologists encourage athletes to prioritize performance/process goals to manage competition anxiety."},
relatedIds:["PSY-002"],source:"Sports Psychology - Weinberg & Gould",tags:["goal-setting"]},

{id:"PSY-005",exam:["KVS PGT","DSSSB"],subject:"Sports Psychology",topic:"Group Dynamics",difficulty:"Hard",type:"MCQ",year:2021,
question:"The phenomenon where individual effort decreases when working in a group (e.g., tug-of-war) compared to working alone is called:",
options:["Social Facilitation","Social Loafing","Group Cohesion","Groupthink"],correctIndex:1,
explanation:"Social Loafing is the tendency for individuals to exert less effort when working collectively in a group than when working individually, often due to reduced accountability.",
concept:{title:"Social Loafing",definition:"A team-dynamics phenomenon relevant to coaching group/team-based training.",points:["More likely in larger groups and unclear individual roles","Reduced by assigning clear, identifiable individual responsibilities","Opposite concept: Social Facilitation (performing better in the presence of others)"],memoryTrick:"'Loafing = lazing off' in a crowd.",sportsRelevance:"Relay and team-sport coaches design drills to counter social loafing by tracking individual contributions."},
relatedIds:["PSY-001"],source:"Sports Psychology - Weinberg & Gould",tags:["group-dynamics"]},

{id:"PSY-006",exam:["UGC NET","SET"],subject:"Sports Psychology",topic:"Mental Training",difficulty:"Moderate",type:"MCQ",year:2024,
question:"Rehearsing a skill mentally, without physical movement, to improve performance is known as:",
options:["Progressive Muscle Relaxation","Imagery / Visualization","Autogenic Training","Biofeedback"],correctIndex:1,
explanation:"Imagery (mental rehearsal/visualization) involves creating or recreating an experience in the mind to enhance skill learning, confidence and performance, without actual physical practice.",
concept:{title:"Psychological Skills Training (PST)",definition:"A set of mental techniques athletes use to enhance performance and manage pressure.",points:["Imagery: mental rehearsal of skills/scenarios","Self-talk: internal dialogue management","Relaxation techniques: manage pre-competition anxiety","Goal-setting: direct effort and focus"],memoryTrick:"'Imagery = imagining it before doing it'.",sportsRelevance:"Widely used by elite athletes (e.g., divers, gymnasts) to rehearse routines mentally before competition."},
relatedIds:["PSY-002","PSY-004"],source:"Sports Psychology - Weinberg & Gould",tags:["mental-training"]},

{id:"PSY-007",exam:["UGC NET","KVS PGT"],subject:"Sports Psychology",topic:"Aggression",difficulty:"Moderate",type:"MCQ",year:2022,
question:"Aggression that is a means to an end (e.g., a hard tackle to gain possession, without intent to injure) is called:",
options:["Hostile Aggression","Instrumental Aggression","Assertive Behavior","Reactive Aggression"],correctIndex:1,
explanation:"Instrumental aggression is goal-directed aggression used as a means to achieve a non-aggressive objective (like winning the ball), distinct from hostile aggression which aims to cause harm.",
concept:{title:"Types of Aggression in Sport",definition:"Sport psychology distinguishes aggression from assertiveness based on intent to harm.",points:["Hostile Aggression: intent to harm is the primary goal","Instrumental Aggression: harm is a byproduct of pursuing another goal (winning)","Assertive Behavior: high-intensity, legal, within-rules effort — not aggression at all"],memoryTrick:"'Instrumental = a tool/instrument toward winning, not harming'.",sportsRelevance:"Referees and coaches distinguish these types when addressing foul play and discipline."},
relatedIds:["PSY-005"],source:"Sports Psychology - Weinberg & Gould",tags:["aggression"]},

{id:"PSY-008",exam:["UGC NET"],subject:"Sports Psychology",topic:"Learning",difficulty:"Hard",type:"MCQ",year:2023,
question:"According to Fitts and Posner's model of motor learning, the final stage where movements become automatic is called:",
options:["Cognitive Stage","Associative Stage","Autonomous Stage","Motivational Stage"],correctIndex:2,
explanation:"In Fitts and Posner's three-stage model, the Autonomous Stage is the final stage where skill execution becomes largely automatic, requiring minimal conscious attention, freeing the athlete to focus on strategy/environment.",
concept:{title:"Fitts & Posner's Stages of Learning",definition:"A widely-cited model describing the progression of motor skill acquisition.",points:["Cognitive Stage: understanding the task, many errors","Associative Stage: refining technique, fewer errors","Autonomous Stage: automatic execution, minimal conscious thought"],memoryTrick:"'C-A-A: Cognitive → Associative → Autonomous' — think, refine, automate.",sportsRelevance:"Coaching cues shift from technical instruction (cognitive stage) to strategic feedback (autonomous stage) as athletes progress."},
relatedIds:["PSY-006"],source:"Motor Learning & Control - Schmidt",tags:["motor-learning"]},

{id:"PSY-009",exam:["KVS PGT","UGC NET"],subject:"Sports Psychology",topic:"Personality",difficulty:"Easy",type:"MCQ",year:2020,
question:"Sports psychology is defined as the scientific study of:",
options:["Only the physical training of athletes","People and their behaviors in sport and exercise contexts, and the practical application of that knowledge","Sports equipment design","Nutrition science for athletes"],correctIndex:1,
explanation:"Sports psychology is the scientific study of people and their behaviors in sport/exercise contexts, applying psychological knowledge to enhance performance and well-being.",
concept:{title:"Definition of Sports Psychology",definition:"A sub-discipline of psychology applied specifically to sport, exercise, and physical activity settings.",points:["Studies both performance enhancement and participant well-being","Two broad roles: academic/research and applied (practitioner) sports psychology","Overlaps with exercise psychology (motivation to be physically active)"],memoryTrick:"'Sport Psych = mind + movement'.",sportsRelevance:"Foundational definition frequently tested in NET/SET exams."},
relatedIds:["PSY-001"],source:"Sports Psychology - Weinberg & Gould",tags:["definitions"]},
